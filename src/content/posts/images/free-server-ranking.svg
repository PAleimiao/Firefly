  <rect x="130" y="76" width="500" height="24" rx="4" fill="#ff7eb6"/>
  <text x="640" y="93" text-anchor="end" font-size="12" font-weight="700" fill="#fff">24 GB</text>

  <!-- Tencent trial 4 -->
  <text x="20" y="132" font-size="13" font-weight="600" fill="#333">腾讯云试用</text>
  <rect x="130" y="116" width="83" height="24" rx="4" fill="#ffa8c6"/>
  <text x="221" y="133" font-size="12" font-weight="700" fill="#333">4 GB</text>

  <!-- Huawei 4 -->
  <text x="20" y="172" font-size="13" font-weight="600" fill="#333">华为云试用</text>
  <rect x="130" y="156" width="83" height="24" rx="4" fill="#ffa8c6"/>
  <text x="221" y="173" font-size="12" font-weight="700" fill="#333">4 GB</text>

  <!-- Aliyun student 2 -->
  <text x="20" y="212" font-size="13" font-weight="600" fill="#333">阿里云学生机</text>
  <rect x="130" y="196" width="42" height="24" rx="4" fill="#ffc2d8"/>
  <text x="180" y="213" font-size="12" font-weight="700" fill="#333">2 GB</text>

  <!-- Tencent campus 2 -->
  <text x="20" y="252" font-size="13" font-weight="600" fill="#333">腾讯云校园</text>
  <rect x="130" y="236" width="42" height="24" rx="4" fill="#ffc2d8"/>
  <text x="180" y="253" font-size="12" font-weight="700" fill="#333">2 GB</text>

  <!-- Aliyun trial 2 -->
  <text x="20" y="292" font-size="13" font-weight="600" fill="#333">阿里云试用</text>
  <rect x="130" y="276" width="42" height="24" rx="4" fill="#ffc2d8"/>
  <text x="180" y="293" font-size="12" font-weight="700" fill="#333">2 GB</text>

  <!-- AWS 1 -->
  <text x="20" y="332" font-size="13" font-weight="600" fill="#333">AWS 12 个月</text>
  <rect x="130" y="316" width="21" height="24" rx="4" fill="#ffd6e5"/>
  <text x="159" y="333" font-size="12" font-weight="700" fill="#333">1 GB</text>

  <!-- axis -->
  <line x1="130" y1="356" x2="630" y2="356" stroke="#f0c4d6" stroke-width="2"/>
  <text x="130" y="376" font-size="11" fill="#999">0</text>
  <text x="254" y="376" font-size="11" fill="#999">5</text>
  <text x="380" y="376" font-size="11" fill="#999">10</text>
  <text x="505" y="376" font-size="11" fill="#999">15</text>
  <text x="630" y="376" font-size="11" fill="#999">20+</text>

  <!-- annotation -->
  <rect x="380" y="86" width="270" height="30" rx="8" fill="#fff" stroke="#ff7eb6" stroke-width="1.5"/>
  <text x="395" y="106" font-size="12" fill="#333">Oracle：你们 free tier 加一起，够我打吗？</text>
  <text x="340" y="408" text-anchor="middle" font-size="11" fill="#bbb">* GitHub 学生包不含服务器直送，走 Azure / Heroku 额度曲线救国</text>
</svg>
