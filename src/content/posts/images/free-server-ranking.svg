<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="680" height="420" rx="12" fill="#fff5f9"/>
  <text x="340" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#333">免费内存排行榜（单位：GB，越长越白嫖）</text>
