<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>弹珠弹球 - CXL避难所游戏站</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; color: #fff; overflow: hidden;
}
.header {
  margin-top: 15px; text-align: center; width: 100%;
}
.header h1 {
  font-size: 2rem; background: linear-gradient(90deg, #00d2ff, #3a7bd5);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.info-bar {
  display: flex; justify-content: center; gap: 30px; margin: 10px 0;
  font-size: 1rem;
}
.info-bar span { color: #aaa; }
.info-bar strong { color: #fff; margin-left: 5px; }
.btn {
  background: linear-gradient(135deg, #00d2ff, #3a7bd5);
  border: none; border-radius: 8px; padding: 8px 20px;
  color: #fff; font-size: 0.95rem; cursor: pointer;
  transition: all 0.2s; box-shadow: 0 4px 15px rgba(0,210,255,0.3);
  margin: 0 5px;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,210,255,0.4); }

#gameCanvas {
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 12px; margin-top: 10px;
  box-shadow: 0 0 40px rgba(0,210,255,0.1);
  background: rgba(0,0,0,0.3);
  max-width: 96vw;
}

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.overlay.active { display: flex; }
.overlay-box {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
  padding: 35px; text-align: center;
}
.overlay-box h2 { font-size: 1.8rem; margin-bottom: 10px; }
.overlay-box p { color: #aaa; margin-bottom: 20px; }

.controls-hint {
  margin-top: 10px; color: #888; font-size: 0.8rem;
}
</style>
</head>
<body>
<div class="header">
  <h1>弹珠弹球</h1>
  <div class="info-bar">
    <div>分数<strong id="score">0</strong></div>
    <div>关卡<strong id="level">1</strong></div>
    <div>生命<strong id="lives">3</strong></div>
  </div>
  <div>
    <button class="btn" onclick="startGame()">开始游戏</button>
    <button class="btn" onclick="pauseGame()">暂停</button>
  </div>
</div>
<canvas id="gameCanvas" width="480" height="560"></canvas>
<div class="controls-hint">🖱️ 鼠标/触摸移动挡板 | 点击发射弹珠</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="ovTitle">准备开始</h2>
    <p id="ovText">点击开始游戏按钮或点击画面发射弹珠</p>
    <button class="btn" onclick="startGame()">开始</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W = canvas.width, H = canvas.height;

// 响应式
function resize() {
  const maxW = Math.min(window.innerWidth * 0.96, 480);
  const scale = maxW / 480;
  canvas.style.width = maxW + 'px';
  canvas.style.height = (560 * scale) + 'px';
}
window.addEventListener('resize', resize); resize();

let paddle = { x: 180, y: 520, w: 100, h: 12, speed: 6 };
let ball = { x: 240, y: 500, r: 7, dx: 0, dy: 0, speed: 4, active: false };
let bricks = [];
let particles = [];
let score = 0, level = 1, lives = 3, running = false, paused = false;
let animationId;

const brickColors = [
  '#e94560','#f5a623','#50c878','#4a90e2','#9b59b6','#e74c3c','#1abc9c','#3498db'
];

function initBricks() {
  bricks = [];
  const rows = 4 + Math.min(level, 4);
  const cols = 8;
  const bw = 50, bh = 18, gap = 6;
  const offsetX = (W - (cols*(bw+gap)-gap))/2;
  const offsetY = 50;
  for(let r=0; r<rows; r++){
    for(let c=0; c<cols; c++){
      bricks.push({
        x: offsetX + c*(bw+gap), y: offsetY + r*(bh+gap),
        w: bw, h: bh, color: brickColors[r % brickColors.length],
        hp: Math.floor(r/2)+1, maxHp: Math.floor(r/2)+1
      });
    }
  }
}

function createParticles(x, y, color) {
  for(let i=0; i<8; i++){
    particles.push({
      x, y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4,
      life: 1, color, size: Math.random()*3+2
    });
  }
}

function resetBall() {
  ball.x = paddle.x + paddle.w/2;
  ball.y = paddle.y - ball.r - 2;
  ball.dx = 0; ball.dy = 0; ball.active = false;
}

function startGame() {
  document.getElementById('overlay').classList.remove('active');
  if(running) return;
  score = 0; level = 1; lives = 3; running = true; paused = false;
  updateUI(); initBricks(); resetBall(); loop();
}

function pauseGame() {
  if(!running) return;
  paused = !paused;
  if(paused) {
    document.getElementById('ovTitle').textContent = '已暂停';
    document.getElementById('ovText').textContent = '点击继续按钮恢复游戏';
    document.querySelector('.overlay-box button').textContent = '继续';
    document.querySelector('.overlay-box button').onclick = ()=>{ paused=false; document.getElementById('overlay').classList.remove('active'); };
    document.getElementById('overlay').classList.add('active');
  }
}

function nextLevel() {
  level++;
  ball.speed = Math.min(4 + level*0.5, 10);
  initBricks(); resetBall();
}

function gameOver(won) {
  running = false; cancelAnimationFrame(animationId);
  document.getElementById('ovTitle').textContent = won ? '恭喜通关！🎉' : '游戏结束';
  document.getElementById('ovText').textContent = won ? `最终得分: ${score}` : `得分: ${score} | 到达关卡: ${level}`;
  document.querySelector('.overlay-box button').textContent = '再来一局';
  document.querySelector('.overlay-box button').onclick = startGame;
  document.getElementById('overlay').classList.add('active');
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lives').textContent = lives;
}

function update() {
  if(paused || !running) return;

  // 球运动
  if(ball.active){
    ball.x += ball.dx; ball.y += ball.dy;
    // 墙壁碰撞
    if(ball.x - ball.r < 0 || ball.x + ball.r > W) ball.dx *= -1;
    if(ball.y - ball.r < 0) ball.dy *= -1;
    if(ball.y + ball.r > H) {
      lives--; updateUI();
      if(lives <= 0) { gameOver(false); return; }
      resetBall(); return;
    }
    // 挡板碰撞
    if(ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
       ball.x >= paddle.x && ball.x <= paddle.x + paddle.w){
      const hitPoint = (ball.x - paddle.x) / paddle.w;
      ball.dx = 6 * (hitPoint - 0.5);
      ball.dy = -Math.abs(ball.dy);
      ball.y = paddle.y - ball.r - 1;
    }
    // 砖块碰撞
    for(let i=bricks.length-1; i>=0; i--){
      const b = bricks[i];
      if(ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
         ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h){
        ball.dy *= -1;
        b.hp--; createParticles(b.x+b.w/2, b.y+b.h/2, b.color);
        if(b.hp <= 0){
          score += b.maxHp * 10;
          bricks.splice(i, 1);
        }
        updateUI();
        if(bricks.length === 0) nextLevel();
        break;
      }
    }
  } else {
    ball.x = paddle.x + paddle.w/2;
    ball.y = paddle.y - ball.r - 2;
  }

  // 粒子
  for(let i=particles.length-1; i>=0; i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= 0.03;
    if(p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0,0,W,H);
  // 背景网格
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for(let i=0;i<W;i+=40){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke(); }
  for(let i=0;i<H;i+=40){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke(); }

  // 砖块
  bricks.forEach(b=>{
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color; ctx.shadowBlur = 10;
    roundRect(ctx, b.x, b.y, b.w, b.h, 4);
    ctx.fill(); ctx.shadowBlur = 0;
    if(b.hp < b.maxHp){
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(b.x, b.y, b.w*(1-b.hp/b.maxHp), b.h);
    }
  });

  // 挡板
  ctx.fillStyle = 'linear-gradient' in ctx ? '#fff' : '#ddd';
  const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y+paddle.h);
  grad.addColorStop(0, '#00d2ff'); grad.addColorStop(1, '#3a7bd5');
  ctx.fillStyle = grad;
  roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fill();
  ctx.shadowColor = '#00d2ff'; ctx.shadowBlur = 15;
  ctx.fill(); ctx.shadowBlur = 0;

  // 球
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 10;
  ctx.fill(); ctx.shadowBlur = 0;

  // 粒子
  particles.forEach(p=>{
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function loop() {
  if(!running) return;
  update(); draw();
  animationId = requestAnimationFrame(loop);
}

// 控制
canvas.addEventListener('mousemove', e=>{
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  paddle.x = (e.clientX - rect.left) * scaleX - paddle.w/2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  paddle.x = (e.touches[0].clientX - rect.left) * scaleX - paddle.w/2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
}, {passive:false});

function launchBall() {
  if(!ball.active && running){
    ball.active = true;
    const angle = -Math.PI/2 + (Math.random()-0.5)*0.5;
    ball.dx = Math.cos(angle) * ball.speed;
    ball.dy = Math.sin(angle) * ball.speed;
  }
}
canvas.addEventListener('click', launchBall);
canvas.addEventListener('touchstart', e=>{ if(e.target===canvas) launchBall(); }, {passive:true});

// 键盘
let keys = {};
document.addEventListener('keydown', e=>{
  keys[e.key] = true;
  if(e.key===' ' || e.key==='Enter'){ e.preventDefault(); launchBall(); }
  if(e.key==='p' || e.key==='P') pauseGame();
});
document.addEventListener('keyup', e=>{ keys[e.key] = false; });

function keyLoop(){
  if(keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.x -= paddle.speed;
  if(keys['ArrowRight'] || keys['d'] || keys['D']) paddle.x += paddle.speed;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  requestAnimationFrame(keyLoop);
}
keyLoop();

// 初始画面
draw();
document.getElementById('overlay').classList.add('active');
</script>
</body>
</html>
