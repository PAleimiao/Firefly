<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CG画廊 - Angel Beats!</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100vh;background:#060614;font-family:'Microsoft YaHei',sans-serif;color:#fff}
#app{min-height:100vh;padding:30px 16px 60px}h1{font-size:1.8rem;letter-spacing:6px;text-align:center;background:linear-gradient(90deg,#a8edea,#fed6e3);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;font-size:.8rem;color:#666;margin-bottom:24px}
.back-btn{display:block;width:fit-content;margin:0 auto 24px;padding:8px 24px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#aaa;font-size:.85rem;text-decoration:none;transition:all .3s}
.back-btn:hover{background:rgba(168,237,234,0.1);border-color:rgba(168,237,234,0.4);color:#fff}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px;max-width:900px;margin-left:auto;margin-right:auto}
.filter-btn{padding:6px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;color:#888;font-size:.78rem;cursor:pointer;transition:all .25s}
.filter-btn:hover,.filter-btn.active{background:rgba(168,237,234,0.1);border-color:rgba(168,237,234,.4);color:#a8edea}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-width:1200px;margin:0 auto}
.cg-item{position:relative;aspect-ratio:16/9;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .3s}
.cg-item:hover{transform:scale(1.03);border-color:rgba(168,237,234,.3)}
.cg-item img{width:100%;height:100%;object-fit:cover;display:block}
.cg-item .cg-label{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;background:rgba(0,0,0,.7);font-size:.7rem;color:#aaa;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg-item.hidden{display:none}
#lightbox{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;flex-direction:column}
#lightbox.active{display:flex}
#lightbox img{max-width:92vw;max-height:82vh;object-fit:contain;border-radius:8px}
#lightbox .lb-close{position:absolute;top:16px;right:20px;font-size:1.8rem;color:#aaa;cursor:pointer}
#lightbox .lb-name{margin-top:12px;font-size:.85rem;color:#888}
#lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:2.5rem;color:rgba(255,255,255,.3);cursor:pointer;padding:20px;user-select:none}
#lightbox .lb-nav:hover{color:rgba(255,255,255,.8)}
#lightbox .lb-prev{left:10px}
#lightbox .lb-next{right:10px}
@media(max-width:500px){h1{font-size:1.4rem}.gallery-grid{grid-template-columns:repeat(2,1fr)}}
</style></head>

let currentIdx=0,visibleItems=[];
function renderGallery(){const g=document.getElementById('gallery');g.innerHTML=cgList.map((cg,i)=>`<div class="cg-item" data-prefix="${cg.prefix}" onclick="openLightbox(this,'${cg.name}')"><img src="assets/cg/${cg.name}" loading="lazy" alt="${cg.name}"><div class="cg-label">${cg.name}</div></div>`).join('');updateVisible();}
function filterCG(prefix){document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');document.querySelectorAll('.cg-item').forEach(item=>{item.classList.toggle('hidden',prefix!=='all'&&item.dataset.prefix!==prefix);});updateVisible();}
function updateVisible(){visibleItems=Array.from(document.querySelectorAll('.cg-item:not(.hidden)'));}
function openLightbox(el,name){updateVisible();currentIdx=visibleItems.indexOf(el);document.getElementById('lb-img').src=el.querySelector('img').src;document.getElementById('lb-name').textContent=name;document.getElementById('lightbox').classList.add('active');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('active');}
function navLightbox(dir){if(!visibleItems.length)return;currentIdx=(currentIdx+dir+visibleItems.length)%visibleItems.length;const el=visibleItems[currentIdx];document.getElementById('lb-img').src=el.querySelector('img').src;document.getElementById('lb-name').textContent=el.querySelector('.cg-label').textContent;}
document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('active'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')navLightbox(-1);if(e.key==='ArrowRight')navLightbox(1);});
renderGallery();
</script></body></html>
