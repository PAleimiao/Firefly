<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>歌曲鉴赏 - Angel Beats!</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100vh;background:#060614;font-family:'Microsoft YaHei',sans-serif;color:#fff}
#app{min-height:100vh;padding:30px 16px 100px}h1{font-size:1.8rem;letter-spacing:6px;text-align:center;background:linear-gradient(90deg,#a8edea,#fed6e3);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;font-size:.8rem;color:#666;margin-bottom:24px}
.back-btn{display:block;width:fit-content;margin:0 auto 24px;padding:8px 24px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#aaa;font-size:.85rem;text-decoration:none;transition:all .3s}
.back-btn:hover{background:rgba(168,237,234,0.1);border-color:rgba(168,237,234,0.4);color:#fff}
.player-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(6,6,20,.95);border-top:1px solid rgba(255,255,255,.08);padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:100;backdrop-filter:blur(12px)}
.player-bar .p-btn{width:40px;height:40px;border-radius:50%;background:rgba(168,237,234,.15);border:1px solid rgba(168,237,234,.4);color:#a8edea;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.player-bar .p-info{flex:1;min-width:0}
.player-bar .p-name{font-size:.85rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-bar .p-time{font-size:.7rem;color:#666;margin-top:2px}
.player-bar .p-progress{flex:1;height:4px;background:rgba(255,255,255,.08);border-radius:2px;cursor:pointer;position:relative;margin:0 8px}
.player-bar .p-progress-bar{height:100%;background:#a8edea;border-radius:2px;width:0%}
.music-list{max-width:800px;margin:0 auto}
.music-item{display:flex;align-items:center;padding:12px 14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .25s}
.music-item:hover{background:rgba(168,237,234,.04);border-color:rgba(168,237,234,.2)}
.music-item.playing{background:rgba(168,237,234,.08);border-color:rgba(168,237,234,.4)}
.music-item .m-num{width:32px;font-size:.75rem;color:#666;text-align:center}
.music-item .m-name{flex:1;font-size:.88rem;color:#ddd}
.music-item .m-dur{font-size:.75rem;color:#555}
.music-item .m-play{width:32px;text-align:center;font-size:1rem;color:#a8edea}
</style></head>
<body><div id="app">
<h1>歌曲鉴赏</h1><div class="subtitle">Angel Beats! BGM全收录（89首）</div>
<a class="back-btn" href="index.html">返回章节选择</a>
<div class="music-list" id="musicList"></div></div>
<div class="player-bar">
<div class="p-btn" onclick="togglePlay()" id="playBtn">▶</div>
<div class="p-info"><div class="p-name" id="nowPlaying">未播放</div><div class="p-time"><span id="curTime">0:00</span> / <span id="totTime">0:00</span></div></div>
<div class="p-progress" onclick="seek(event)"><div class="p-progress-bar" id="progressBar"></div></div>
<input type="range" style="width:80px" min="0" max="100" value="70" oninput="setVol(this.value)"></div>
<script>
const tracks=['assets/bgm/024.ogg','assets/bgm/025.ogg','assets/bgm/027.ogg','assets/bgm/029.ogg','assets/bgm/030.ogg','assets/bgm/031.ogg','assets/bgm/032.ogg','assets/bgm/033.ogg','assets/bgm/037.ogg','assets/bgm/042.ogg','assets/bgm/043.ogg','assets/bgm/051.ogg','assets/bgm/054.ogg','assets/bgm/055.ogg','assets/bgm/060.ogg','assets/bgm/061.ogg','assets/bgm/062.ogg','assets/bgm/071.ogg','assets/bgm/072.ogg','assets/bgm/073.ogg','assets/bgm/081.ogg','assets/bgm/082.ogg','assets/bgm/083.ogg','assets/bgm/084.ogg','assets/bgm/085.ogg','assets/bgm/086.ogg','assets/bgm/087.ogg','assets/bgm/092.ogg','assets/bgm/102.ogg','assets/bgm/103.ogg','assets/bgm/104.ogg','assets/bgm/105.ogg','assets/bgm/106.ogg','assets/bgm/107.ogg','assets/bgm/108.ogg','assets/bgm/109.ogg','assets/bgm/110.ogg','assets/bgm/111.ogg','assets/bgm/112.ogg','assets/bgm/113.ogg','assets/bgm/114.ogg','assets/bgm/115.ogg','assets/bgm/116.ogg','assets/bgm/117.ogg','assets/bgm/118.ogg','assets/bgm/119.ogg','assets/bgm/120.ogg','assets/bgm/120B.ogg','assets/bgm/121.ogg','assets/bgm/122.ogg','assets/bgm/123.ogg','assets/bgm/124.ogg','assets/bgm/125.ogg','assets/bgm/126.ogg','assets/bgm/127.ogg','assets/bgm/201.ogg','assets/bgm/202.ogg','assets/bgm/203.ogg','assets/bgm/204.ogg','assets/bgm/205.ogg','assets/bgm/206.ogg','assets/bgm/207.ogg','assets/bgm/208.ogg','assets/bgm/209.ogg','assets/bgm/210.ogg','assets/bgm/211.ogg','assets/bgm/212.ogg','assets/bgm/213.ogg','assets/bgm/214.ogg','assets/bgm/215.ogg','assets/bgm/216.ogg','assets/bgm/217.ogg','assets/bgm/218.ogg','assets/bgm/301.ogg','assets/bgm/302.ogg','assets/bgm/303.ogg','assets/bgm/Alchemy.ogg','assets/bgm/CrowSong.ogg','assets/bgm/Hajimari.ogg','assets/bgm/HajimariPf.ogg','assets/bgm/HeartilySong.ogg','assets/bgm/HotMeal.ogg','assets/bgm/Hotmeal_Humming.ogg','assets/bgm/MySong.ogg','assets/bgm/MySoul.ogg','assets/bgm/MySoul_intro.ogg','assets/bgm/ThousandEnemies.ogg','assets/bgm/Treasure.ogg','assets/bgm/kyuff.ogg'];
let audio=null,currentIdx=-1,isPlaying=false;
function renderList(){const list=document.getElementById('musicList');list.innerHTML=tracks.map((t,i)=>{const name=t.split('/').pop();return`<div class="music-item" onclick="playMusic(${i})" id="track-${i}"><div class="m-num">${i+1}</div><div class="m-name">${name}</div><div class="m-dur" id="dur-${i}">--:--</div><div class="m-play" id="icon-${i}">▶</div></div>`;}).join('');}
function playMusic(idx){if(audio){audio.pause();audio=null;}currentIdx=idx;audio=new Audio(tracks[idx]);audio.volume=0.7;audio.play().catch(()=>{});isPlaying=true;updateUI();audio.addEventListener('timeupdate',updateProgress);audio.addEventListener('ended',()=>{isPlaying=false;updateUI();});audio.addEventListener('loadedmetadata',()=>{document.getElementById('totTime').textContent=fmtTime(audio.duration);document.getElementById('dur-'+idx).textContent=fmtTime(audio.duration);});}
function togglePlay(){if(!audio)return;if(isPlaying){audio.pause();isPlaying=false;}else{audio.play().catch(()=>{});isPlaying=true;}updateUI();}
function updateUI(){document.getElementById('nowPlaying').textContent=currentIdx>=0?tracks[currentIdx].split('/').pop():'未播放';document.getElementById('playBtn').textContent=isPlaying?'⏸':'▶';document.querySelectorAll('.music-item').forEach((el,i)=>{el.classList.toggle('playing',i===currentIdx);document.getElementById('icon-'+i).textContent=(i===currentIdx&&isPlaying)?'⏸':'▶';});}
function updateProgress(){if(!audio)return;document.getElementById('curTime').textContent=fmtTime(audio.currentTime);const pct=(audio.currentTime/audio.duration)*100;document.getElementById('progressBar').style.width=pct+'%';}
function seek(e){if(!audio)return;const rect=e.currentTarget.getBoundingClientRect();const pct=(e.clientX-rect.left)/rect.width;audio.currentTime=pct*audio.duration;}
function setVol(v){if(audio)audio.volume=v/100;}
function fmtTime(s){if(!s||isNaN(s))return'0:00';const m=Math.floor(s/60);const sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}
renderList();
</script></body></html>
