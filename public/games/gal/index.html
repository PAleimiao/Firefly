<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Angel Beats - 毕业 - CXL避难所</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #000; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  color: #fff; user-select: none;
}

/* 背景层 */
#bg-layer {
  position: fixed; inset: 0; z-index: 1;
  background-size: cover; background-position: center;
  transition: opacity 1s ease;
}
#bg-layer.fade { opacity: 0; }

/* 立绘层 */
#char-layer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 2;
  height: 75%; display: flex; align-items: flex-end; justify-content: center;
  pointer-events: none;
}
.char {
  position: absolute; bottom: 0; height: 90%;
  opacity: 0; transform: translateY(20px);
  transition: all 0.6s ease;
  filter: drop-shadow(0 0 30px rgba(0,0,0,0.5));
}
.char.active { opacity: 1; transform: translateY(0); }
.char.left { left: 5%; }
.char.center { left: 50%; transform: translateX(-50%) translateY(20px); }
.char.center.active { transform: translateX(-50%) translateY(0); }
.char.right { right: 5%; }

/* 对话框 */
#dialog-box {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  width: 90%; max-width: 900px; z-index: 10;
  background: rgba(0,0,0,0.75);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px; padding: 20px 28px;
  backdrop-filter: blur(10px);
  cursor: pointer; min-height: 120px;
}
#speaker {
  font-size: 1.1rem; font-weight: bold; color: #a8edea;
  margin-bottom: 8px; padding-left: 4px;
  border-left: 3px solid #a8edea; padding-left: 10px;
}
#text {
  font-size: 1.05rem; line-height: 1.8; color: #eee;
  min-height: 60px;
}
#text .cursor {
  display: inline-block; width: 2px; height: 1.1em;
  background: #a8edea; margin-left: 2px;
  animation: blink 0.8s infinite;
  vertical-align: text-bottom;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* 选项 */
#choices {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 20; display: none; flex-direction: column; gap: 12px;
  width: 80%; max-width: 400px;
}
#choices.active { display: flex; }
.choice-btn {
  background: rgba(0,0,0,0.8);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px; padding: 14px 20px;
  color: #fff; font-size: 1rem; cursor: pointer;
  text-align: center; transition: all 0.2s;
  backdrop-filter: blur(10px);
}
.choice-btn:hover {
  background: rgba(168,237,234,0.15);
  border-color: #a8edea; transform: translateX(5px);
}

/* 顶部UI */
#top-ui {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 20px; background: rgba(0,0,0,0.3);
}
#top-ui button {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 6px; padding: 6px 14px; color: #ccc;
  font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
}
#top-ui button:hover { background: rgba(255,255,255,0.15); color: #fff; }
#chapter-title {
  font-size: 0.9rem; color: #888; letter-spacing: 2px;
}

/* 设置面板 */
#settings {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(0,0,0,0.85);
  display: none; align-items: center; justify-content: center;
}
#settings.active { display: flex; }
.settings-box {
  background: rgba(20,20,30,0.95); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 30px; width: 320px;
}
.settings-box h2 { font-size: 1.3rem; margin-bottom: 20px; text-align: center; }
.setting-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
.setting-row label { font-size: 0.9rem; color: #aaa; }
.setting-row input[type="range"] { width: 120px; }
.setting-row span { font-size: 0.8rem; color: #888; width: 40px; text-align: right; }
.close-btn {
  width: 100%; margin-top: 15px; padding: 10px;
  background: rgba(168,237,234,0.15); border: 1px solid #a8edea;
  border-radius: 8px; color: #a8edea; cursor: pointer;
}

/* 历史记录 */
#history {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(0,0,0,0.9);
  display: none; flex-direction: column;
}
#history.active { display: flex; }
#history-header {
  padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex; justify-content: space-between; align-items: center;
}
#history-list {
  flex: 1; overflow-y: auto; padding: 20px;
}
.history-item { margin-bottom: 12px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 6px; }
.history-speaker { color: #a8edea; font-weight: bold; font-size: 0.85rem; margin-bottom: 4px; }
.history-text { color: #ccc; font-size: 0.9rem; }

/* 标题画面 */
#title-screen {
  position: fixed; inset: 0; z-index: 50;
  background: linear-gradient(180deg, #0a0a1a 0%, #1a1a2e 50%, #0d0d1a 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#title-screen h1 {
  font-size: 3rem; letter-spacing: 8px; margin-bottom: 10px;
  background: linear-gradient(90deg, #a8edea, #fed6e3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#title-screen h2 {
  font-size: 1rem; color: #888; letter-spacing: 4px; margin-bottom: 60px;
}
.title-btn {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px; padding: 12px 50px; margin: 8px 0;
  color: #ddd; font-size: 1rem; cursor: pointer;
  transition: all 0.3s; min-width: 200px; text-align: center;
}
.title-btn:hover {
  background: rgba(168,237,234,0.1); border-color: #a8edea; color: #fff;
  transform: translateY(-2px);
}

/* 章节标题动画 */
#chapter-overlay {
  position: fixed; inset: 0; z-index: 45;
  background: #000; display: none; align-items: center; justify-content: center;
}
#chapter-overlay.active { display: flex; }
#chapter-overlay h1 {
  font-size: 2.5rem; letter-spacing: 6px;
  animation: chapterFade 2.5s ease forwards;
}
@keyframes chapterFade {
  0% { opacity: 0; transform: scale(0.9); }
  30% { opacity: 1; transform: scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; }
}

/* 跳过按钮 */
#skip-hint {
  position: fixed; bottom: 160px; right: 20px; z-index: 10;
  color: #888; font-size: 0.75rem; opacity: 0;
  transition: opacity 0.3s;
}
#skip-hint.active { opacity: 1; }
</style>
</head>
<body>

<!-- 标题画面 -->
<div id="title-screen">
  <h1>Angel Beats!</h1>
  <h2>毕业</h2>
  <div class="title-btn" onclick="startGame()">开始游戏</div>
  <div class="title-btn" onclick="loadGame()">继续游戏</div>
  <div class="title-btn" onclick="showSettings()">设置</div>
</div>

<!-- 章节标题 -->
<div id="chapter-overlay"><h1 id="chapter-text"></h1></div>

<!-- 背景 -->
<div id="bg-layer"></div>

<!-- 立绘 -->
<div id="char-layer"></div>

<!-- 对话框 -->
<div id="dialog-box" onclick="advance()">
  <div id="speaker"></div>
  <div id="text"></div>
</div>

<!-- 选项 -->
<div id="choices"></div>

<!-- 顶部UI -->
<div id="top-ui" style="display:none;">
  <div id="chapter-title">毕业</div>
  <div>
    <button onclick="toggleAuto()" id="autoBtn">自动</button>

</div>

<!-- 设置 -->
<div id="settings">

    </div>
    <div class="setting-row">

    </div>
    <button class="close-btn" onclick="hideSettings()">关闭</button>
  </div>
</div>

<!-- 历史 -->
<div id="history">
  <div id="history-header">
    <h3>历史记录</h3>
    <button onclick="hideHistory()">关闭</button>
  </div>
  <div id="history-list"></div>

<!-- 跳过提示 -->
<div id="skip-hint">按住Ctrl跳过已读</div>

<!-- BGM -->
<audio id="bgm" loop></audio>

// ========== 角色配置 ==========
const CHARACTERS = {
  yuzuru: { name: '音无结弦', color: '#a8edea', img: 'yuzuru.png' },
  kanade: { name: '立华奏', color: '#fed6e3', img: 'kanade.png' },
  yuri: { name: '仲村由理', color: '#e94560', img: 'yuri.png' },
  hinata: { name: '日向秀树', color: '#4dabf7', img: 'hinata.png' },
  yui: { name: '由依', color: '#ffd43b', img: 'yui.png' },
  // shiina 暂无立绘
};

// ========== 状态 ==========
let currentIndex = 0;
let isTyping = false;
let typeTimer = null;
let autoMode = false;
let skipMode = false;
let settings = { textSpeed: 50, bgmVol: 70, seVol: 80 };
let history = [];
let charsOnScreen = {};

// ========== 初始化 ==========
function init() {
  loadSettings();
  document.getElementById('bgm').volume = settings.bgmVol / 100;
}

function startGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('top-ui').style.display = 'flex';
  currentIndex = 0;
  history = [];
  charsOnScreen = {};
  document.getElementById('char-layer').innerHTML = '';
  processLine();
}

function loadGame() {
  const save = localStorage.getItem('gal_save');
  if(save) {
    const data = JSON.parse(save);
    currentIndex = data.index || 0;
    history = data.history || [];
    document.getElementById('title-screen').style.display = 'none';
    document.getElementById('top-ui').style.display = 'flex';
    charsOnScreen = {};
    document.getElementById('char-layer').innerHTML = '';
    processLine();
  } else {
    startGame();
  }
}

// ========== 核心处理 ==========
function processLine() {
  if(currentIndex >= SCRIPT.length) return;
  const line = SCRIPT[currentIndex];

  switch(line.type) {
    case 'chapter':
      showChapter(line.text);
      currentIndex++;
      break;
    case 'bg':
      setBG(line.src);
      currentIndex++;
      setTimeout(processLine, 800);
      break;
    case 'bgm':
      playBGM(line.src);
      currentIndex++;
      processLine();
      break;
    case 'char':
      handleChar(line);
      currentIndex++;
      setTimeout(processLine, 600);
      break;
    case 'text':
      showText(line);
      break;
    case 'choice':
      showChoices(line.choices);
      break;
  }
}

function showChapter(text) {
  const overlay = document.getElementById('chapter-overlay');
  document.getElementById('chapter-text').innerHTML = text.replace(/\n/g, '<br>');
  overlay.classList.add('active');
  setTimeout(() => { overlay.classList.remove('active'); }, 2500);
}

function setBG(src) {
  const bg = document.getElementById('bg-layer');
  bg.style.backgroundImage = `url(assets/backgrounds/${src})`;
}

function playBGM(src) {
  const bgm = document.getElementById('bgm');
  bgm.src = `assets/bgm/${src}`;
  bgm.play().catch(()=>{});
}

function handleChar(line) {
  const layer = document.getElementById('char-layer');
  const key = line.char + '_' + line.pos;

  if(line.action === 'hide') {
    const el = document.querySelector(`.char[data-key="${key}"]`);
    if(el) { el.classList.remove('active'); setTimeout(()=>el.remove(), 600); }
    delete charsOnScreen[key];
    return;
  }

  // 移除同位置的其他角色
  Object.keys(charsOnScreen).forEach(k => {
    if(k.endsWith('_' + line.pos) && k !== key) {
      const old = document.querySelector(`.char[data-key="${k}"]`);
      if(old) { old.classList.remove('active'); setTimeout(()=>old.remove(), 600); }
      delete charsOnScreen[k];
    }
  });

  const charInfo = CHARACTERS[line.char];
  let el = document.querySelector(`.char[data-key="${key}"]`);
  if(!el) {
    el = document.createElement('img');
    el.className = `char ${line.pos}`;
    el.dataset.key = key;
    el.src = `assets/characters/${charInfo.img}`;
    el.alt = charInfo.name;
    layer.appendChild(el);
    charsOnScreen[key] = true;
  }
  // 强制重排
  void el.offsetWidth;
  el.classList.add('active');
}

function showText(line) {
  const speakerEl = document.getElementById('speaker');
  const textEl = document.getElementById('text');

  if(line.speaker) {
    const charInfo = CHARACTERS[Object.keys(CHARACTERS).find(k=>CHARACTERS[k].name===line.speaker)];
    speakerEl.textContent = line.speaker;
    speakerEl.style.color = charInfo ? charInfo.color : '#a8edea';
    speakerEl.style.borderLeftColor = charInfo ? charInfo.color : '#a8edea';
  } else {
    speakerEl.textContent = '';
  }

  // 记录历史
  if(line.text) history.push({ speaker: line.speaker, text: line.text });

  textEl.innerHTML = '';
  isTyping = true;

  const speed = 110 - settings.textSpeed; // 10~100
  let i = 0;
  const text = line.text;

  function typeChar() {
    if(!isTyping) return;
    if(i < text.length) {
      textEl.innerHTML = text.substring(0, i+1) + '<span class="cursor"></span>';
      i++;
      if(skipMode) { typeChar(); }
      else { typeTimer = setTimeout(typeChar, speed); }
    } else {
      textEl.textContent = text;
      isTyping = false;
      if(autoMode) {
        setTimeout(() => { if(autoMode) advance(); }, 1500);
      }
    }
  }
  typeChar();
}

function advance() {
  if(isTyping) {
    isTyping = false;
    clearTimeout(typeTimer);
    const line = SCRIPT[currentIndex];
    if(line && line.type === 'text') {
      document.getElementById('text').textContent = line.text;
    }
    return;
  }
  currentIndex++;
  if(currentIndex < SCRIPT.length) processLine();
}

// ========== 选项 ==========
function showChoices(choices) {
  const container = document.getElementById('choices');
  container.innerHTML = '';
  choices.forEach((c, i) => {
    const btn = document.createElement('div');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => { container.classList.remove('active'); currentIndex = c.target; processLine(); };
    container.appendChild(btn);
  });
  container.classList.add('active');
}

// ========== 存档 ==========
function quickSave() {
  const data = { index: currentIndex, history: history.slice(-50) };
  localStorage.setItem('gal_save', JSON.stringify(data));
  showStatus('已存档');
}

function showStatus(msg) {
  const s = document.getElementById('status');
  s.textContent = msg; s.style.color = '#a8edea';
  setTimeout(() => { s.textContent = ''; s.style.color = '#555'; }, 1500);
}

// ========== 自动/快进 ==========
function toggleAuto() {
  autoMode = !autoMode;
  skipMode = false;
  document.getElementById('autoBtn').style.color = autoMode ? '#a8edea' : '#ccc';
  document.getElementById('skipBtn').style.color = '#ccc';
  document.getElementById('skip-hint').classList.remove('active');
  if(autoMode && !isTyping) advance();
}

function toggleSkip() {
  skipMode = !skipMode;
  autoMode = false;
  document.getElementById('skipBtn').style.color = skipMode ? '#a8edea' : '#ccc';
  document.getElementById('autoBtn').style.color = '#ccc';
  document.getElementById('skip-hint').classList.toggle('active', skipMode);
}

// ========== 历史 ==========
function showHistory() {
  const list = document.getElementById('history-list');
  list.innerHTML = history.map(h => `
    <div class="history-item">
      <div class="history-speaker">${h.speaker || '旁白'}</div>
      <div class="history-text">${h.text}</div>
    </div>
  `).join('');
  document.getElementById('history').classList.add('active');
}
function hideHistory() { document.getElementById('history').classList.remove('active'); }

// ========== 设置 ==========
function showSettings() { document.getElementById('settings').classList.add('active'); }
function hideSettings() { document.getElementById('settings').classList.remove('active'); }
function updateSetting(key, val) {
  settings[key] = parseInt(val);
  if(key === 'textSpeed') document.getElementById('textSpeedVal').textContent = val < 40 ? '慢' : val > 70 ? '快' : '中';
  if(key === 'bgmVol') { document.getElementById('bgmVolVal').textContent = val+'%'; document.getElementById('bgm').volume = val/100; }
  if(key === 'seVol') document.getElementById('seVolVal').textContent = val+'%';
  saveSettings();
}
function saveSettings() { localStorage.setItem('gal_settings', JSON.stringify(settings)); }
function loadSettings() {
  const s = localStorage.getItem('gal_settings');
  if(s) { Object.assign(settings, JSON.parse(s)); document.getElementById('textSpeed').value = settings.textSpeed; document.getElementById('bgmVol').value = settings.bgmVol; document.getElementById('seVol').value = settings.seVol; }
}

// ========== 键盘 ==========
document.addEventListener('keydown', e => {
  if(document.getElementById('title-screen').style.display !== 'none') return;
  if(e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
  if(e.key === 'Control') { if(!skipMode) toggleSkip(); }
  if(e.key === 'a' || e.key === 'A') toggleAuto();
  if(e.key === 's' || e.key === 'S') quickSave();
});
document.addEventListener('keyup', e => {
  if(e.key === 'Control' && skipMode) toggleSkip();
});

// 右键菜单屏蔽
document.addEventListener('contextmenu', e => e.preventDefault());

init();
</script>
</body>
</html>
