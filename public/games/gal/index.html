<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Angel Beats! - 毕业 - CXL避难所</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #000; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  color: #fff; user-select: none; -webkit-tap-highlight-color: transparent;
}

/* 游戏根容器 - 强制全屏隔离 */
#game-root {
  position: fixed; inset: 0; z-index: 99999;
  width: 100vw; height: 100vh; overflow: hidden;
  background: #000;
}

/* 背景层 */
#bg-layer {
  position: absolute; inset: 0; z-index: 1;
  background-size: cover; background-position: center;
  transition: opacity 1.5s ease;
}
#bg-layer.fade { opacity: 0; }

/* CG全屏展示层 */
#cg-layer {
  position: absolute; inset: 0; z-index: 2;
  background-size: contain; background-repeat: no-repeat; background-position: center;
  opacity: 0; transition: opacity 1.2s ease;
  pointer-events: none;
}
#cg-layer.active { opacity: 1; }

/* 立绘层 */
#char-layer {
  position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
  height: 78%; pointer-events: none;
}
.char {
  position: absolute; bottom: 0; height: 92%;
  opacity: 0; transform: translateY(40px);
  transition: all 0.9s cubic-bezier(0.22, 1, 0.36, 1);
  filter: drop-shadow(0 0 50px rgba(0,0,0,0.7));
  max-width: 55%;
}
.char.active { opacity: 1; transform: translateY(0); }
.char.left { left: 2%; }
.char.center { left: 50%; transform: translateX(-50%) translateY(40px); }
.char.center.active { transform: translateX(-50%) translateY(0); }
.char.right { right: 2%; }

/* 暗角遮罩 */
#vignette {
  position: absolute; inset: 0; z-index: 4;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
  pointer-events: none;
}

/* 对话框 */
#dialog-box {
  position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
  width: 94%; max-width: 900px; z-index: 10;
  background: rgba(0,0,0,0.82);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 18px 24px 20px;
  backdrop-filter: blur(16px);
  cursor: pointer; min-height: 120px;
  transition: opacity 0.4s;
}
#dialog-box.hidden { opacity: 0; pointer-events: none; }
#speaker {
  font-size: 1.05rem; font-weight: bold;
  margin-bottom: 8px; padding-left: 4px;
  border-left: 3px solid; padding-left: 10px;
  letter-spacing: 1px;
}
#text {
  font-size: 1rem; line-height: 1.85; color: #eee;
  min-height: 56px; letter-spacing: 0.5px;
}
#text .cursor {
  display: inline-block; width: 2px; height: 1.1em;
  background: currentColor; margin-left: 3px;
  animation: blink 0.85s infinite;
  vertical-align: text-bottom;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* 选项 */
#choices {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 20; display: none; flex-direction: column; gap: 14px;
  width: 82%; max-width: 400px;
}
#choices.active { display: flex; }
.choice-btn {
  background: rgba(0,0,0,0.88);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px; padding: 15px 24px;
  color: #fff; font-size: 1rem; cursor: pointer;
  text-align: center; transition: all 0.3s;
  backdrop-filter: blur(12px); letter-spacing: 1px;
}
.choice-btn:hover, .choice-btn:active {
  background: rgba(168,237,234,0.15);
  border-color: #a8edea; transform: translateX(8px);
}

/* 顶部UI */
#top-ui {
  position: absolute; top: 0; left: 0; right: 0; z-index: 30;
  display: none; justify-content: space-between; align-items: center;
  padding: 10px 16px; background: rgba(0,0,0,0.4);
}
#top-ui.active { display: flex; }
#top-ui button {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px; padding: 5px 12px; color: #aaa;
  font-size: 0.76rem; cursor: pointer; transition: all 0.2s; margin-left: 6px;
}
#top-ui button:hover { background: rgba(255,255,255,0.14); color: #fff; }
#chapter-title { font-size: 0.82rem; color: #999; letter-spacing: 2px; }

/* 设置面板 */
#settings {
  position: absolute; inset: 0; z-index: 40;
  background: rgba(0,0,0,0.9);
  display: none; align-items: center; justify-content: center;
}
#settings.active { display: flex; }
.settings-box {
  background: rgba(14,14,24,0.98); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; padding: 32px; width: 320px;
}
.settings-box h2 { font-size: 1.25rem; margin-bottom: 22px; text-align: center; letter-spacing: 3px; }
.setting-row { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; }
.setting-row label { font-size: 0.88rem; color: #aaa; }
.setting-row input[type="range"] { width: 120px; }
.setting-row span { font-size: 0.78rem; color: #888; width: 46px; text-align: right; }
.close-btn {
  width: 100%; margin-top: 16px; padding: 11px;
  background: rgba(168,237,234,0.1); border: 1px solid rgba(168,237,234,0.4);
  border-radius: 10px; color: #a8edea; cursor: pointer; font-size: 0.92rem;
  transition: all 0.2s;
}
.close-btn:hover { background: rgba(168,237,234,0.2); }

/* 历史记录 */
#history {
  position: absolute; inset: 0; z-index: 40;
  background: rgba(0,0,0,0.94);
  display: none; flex-direction: column;
}
#history.active { display: flex; }
#history-header {
  padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; justify-content: space-between; align-items: center;
}
#history-list {
  flex: 1; overflow-y: auto; padding: 18px;
}
.history-item { margin-bottom: 12px; padding: 12px 14px; background: rgba(255,255,255,0.035); border-radius: 10px; }
.history-speaker { color: #a8edea; font-weight: bold; font-size: 0.82rem; margin-bottom: 4px; }
.history-text { color: #ccc; font-size: 0.9rem; line-height: 1.6; }

/* 标题画面 */
#title-screen {
  position: absolute; inset: 0; z-index: 50;
  background: linear-gradient(180deg, #060614 0%, #121228 45%, #080818 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#title-screen h1 {
  font-size: 2.6rem; letter-spacing: 12px; margin-bottom: 10px;
  background: linear-gradient(90deg, #a8edea, #fed6e3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#title-screen h2 {
  font-size: 0.9rem; color: #666; letter-spacing: 6px; margin-bottom: 55px;
}
.title-btn {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; padding: 13px 52px; margin: 8px 0;
  color: #bbb; font-size: 1rem; cursor: pointer;
  transition: all 0.35s; min-width: 240px; text-align: center; letter-spacing: 2px;
}
.title-btn:hover {
  background: rgba(168,237,234,0.08); border-color: rgba(168,237,234,0.5); color: #fff;
  transform: translateY(-2px); box-shadow: 0 4px 20px rgba(168,237,234,0.1);
}

/* 章节标题 */
#chapter-overlay {
  position: absolute; inset: 0; z-index: 45;
  background: #000; display: none; align-items: center; justify-content: center;
}
#chapter-overlay.active { display: flex; }
#chapter-overlay h1 {
  font-size: 2rem; letter-spacing: 6px; text-align: center; line-height: 1.8;
  animation: chapterFade 3s ease forwards;
}
@keyframes chapterFade {
  0% { opacity: 0; transform: scale(0.9); }
  25% { opacity: 1; transform: scale(1); }
  75% { opacity: 1; }
  100% { opacity: 0; }
}

/* 状态提示 */
#status-toast {
  position: absolute; top: 56px; left: 50%; transform: translateX(-50%);
  z-index: 50; padding: 9px 24px; background: rgba(0,0,0,0.85);
  border: 1px solid rgba(168,237,234,0.25); border-radius: 24px;
  color: #a8edea; font-size: 0.85rem; opacity: 0; transition: opacity 0.35s;
  pointer-events: none; letter-spacing: 1px;
}
#status-toast.active { opacity: 1; }

/* 结束画面 */
#end-screen {
  position: absolute; inset: 0; z-index: 48;
  background: #000; display: none; flex-direction: column;
  align-items: center; justify-content: center;
}
#end-screen.active { display: flex; }
#end-screen h1 { font-size: 1.8rem; letter-spacing: 8px; margin-bottom: 16px; color: #a8edea; }
#end-screen p { color: #888; font-size: 0.9rem; letter-spacing: 2px; margin-bottom: 40px; }
#end-screen .end-btn {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; padding: 12px 40px; color: #bbb; cursor: pointer;
  font-size: 0.95rem; transition: all 0.3s; letter-spacing: 2px;
}
#end-screen .end-btn:hover { background: rgba(168,237,234,0.1); border-color: #a8edea; color: #fff; }

@media (max-width: 600px) {
  #title-screen h1 { font-size: 1.9rem; letter-spacing: 6px; }
  .char { height: 82%; }
  #dialog-box { width: 96%; padding: 14px 16px 16px; bottom: 14px; }
  #text { font-size: 0.95rem; }
}
</style>
</head>
<body>

<div id="game-root">

<!-- 标题画面 -->
<div id="title-screen">
  <h1>Angel Beats!</h1>
  <h2>毕业</h2>
  <div class="title-btn" onclick="startGame(); event.stopPropagation();">开始游戏</div>
  <div class="title-btn" onclick="loadGame(); event.stopPropagation();">继续游戏</div>
  <div class="title-btn" onclick="showSettings(); event.stopPropagation();">设置</div>
</div>

<!-- 章节标题 -->
<div id="chapter-overlay"><h1 id="chapter-text"></h1></div>

<!-- 背景 -->
<div id="bg-layer"></div>

<!-- CG层 -->
<div id="cg-layer"></div>

<!-- 暗角 -->
<div id="vignette"></div>

<!-- 立绘 -->
<div id="char-layer"></div>

<!-- 对话框 -->
<div id="dialog-box" onclick="advance()">
  <div id="speaker"></div>
  <div id="text"></div>
</div>

<!-- 选项 -->
<div id="choices"></div>

<!-- 顶部UI -->
<div id="top-ui">
  <div id="chapter-title">毕业</div>
  <div>
    <button onclick="toggleAuto()" id="autoBtn">自动</button>
    <button onclick="toggleSkip()" id="skipBtn">快进</button>
    <button onclick="showHistory()">历史</button>
    <button onclick="quickSave()">存档</button>
    <button onclick="showSettings()">设置</button>
  </div>
</div>

<!-- 设置 -->
<div id="settings" onclick="if(event.target===this) hideSettings();">
  <div class="settings-box">
    <h2>设置</h2>
    <div class="setting-row">
      <label>文字速度</label>
      <input type="range" id="textSpeed" min="10" max="100" value="50" oninput="updateSetting('textSpeed', this.value)">
      <span id="textSpeedVal">中</span>
    </div>
    <div class="setting-row">
      <label>BGM音量</label>
      <input type="range" id="bgmVol" min="0" max="100" value="70" oninput="updateSetting('bgmVol', this.value)">
      <span id="bgmVolVal">70%</span>
    </div>
    <div class="setting-row">
      <label>音效音量</label>
      <input type="range" id="seVol" min="0" max="100" value="80" oninput="updateSetting('seVol', this.value)">
      <span id="seVolVal">80%</span>
    </div>
    <button class="close-btn" onclick="hideSettings()">关闭</button>
  </div>
</div>

<!-- 历史 -->
<div id="history">
  <div id="history-header">
    <h3>历史记录</h3>
    <button onclick="hideHistory()">关闭</button>
  </div>
  <div id="history-list"></div>
</div>

<!-- 结束画面 -->
<div id="end-screen">
  <h1>故事结束</h1>
  <p>Thank you for playing.</p>
  <div class="end-btn" onclick="location.reload()">返回标题</div>
</div>

<!-- 状态提示 -->
<div id="status-toast"></div>

<!-- BGM -->
<audio id="bgm" loop></audio>

<script>

  { type: "char", char: "hinata", pos: "right" },

// ========== 状态 ==========
let currentIndex = 0;
let isTyping = false;
let typeTimer = null;
let autoMode = false;
let skipMode = false;
let settings = { textSpeed: 50, bgmVol: 70, seVol: 80 };
let history = [];
let charsOnScreen = {};
let cgActive = false;

// ========== 初始化 ==========
function init() {
  loadSettings();
  const bgm = document.getElementById('bgm');
  if(bgm) bgm.volume = settings.bgmVol / 100;
}

function startGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('top-ui').classList.add('active');
  currentIndex = 0;
  history = [];
  charsOnScreen = {};
  cgActive = false;
  document.getElementById('char-layer').innerHTML = '';
  document.getElementById('cg-layer').classList.remove('active');
  document.getElementById('end-screen').classList.remove('active');
  processLine();
}

function loadGame() {
  const save = localStorage.getItem('gal_save');
  if(save) {
    try {
      const data = JSON.parse(save);
      currentIndex = data.index || 0;
      history = data.history || [];
      document.getElementById('title-screen').style.display = 'none';
      document.getElementById('top-ui').classList.add('active');
      charsOnScreen = {};
      cgActive = false;
      document.getElementById('char-layer').innerHTML = '';
      document.getElementById('cg-layer').classList.remove('active');
      document.getElementById('end-screen').classList.remove('active');
      processLine();
    } catch(e) {
      showToast('存档损坏，重新开始');
      startGame();
    }
  } else {
    showToast('没有存档');
    startGame();
  }
}

// ========== BGM ==========
function playBGM(src) {
  const bgm = document.getElementById('bgm');
  if(!bgm) return;
  const vol = settings.bgmVol / 100;
  if(bgm.src && bgm.src.includes(src) && !bgm.paused) return;

  if(!bgm.paused && bgm.src) {
    const fadeOut = setInterval(() => {
      if(bgm.volume > 0.05) { bgm.volume -= 0.05; }
      else {
        clearInterval(fadeOut);
        bgm.pause();
        switchBGM(bgm, src, vol);
      }
    }, 80);
  } else {
    switchBGM(bgm, src, vol);
  }
}

function switchBGM(bgm, src, vol) {
  bgm.src = 'assets/bgm/' + src;
  bgm.volume = 0;
  bgm.play().then(() => {
    const fadeIn = setInterval(() => {
      if(bgm.volume < vol - 0.03) { bgm.volume += 0.03; }
      else { bgm.volume = vol; clearInterval(fadeIn); }
    }, 60);
  }).catch(()=>{});
}

// ========== 核心处理 ==========
function processLine() {
  if(currentIndex >= SCRIPT.length) {
    showEndScreen();
    return;
  }
  const line = SCRIPT[currentIndex];

  switch(line.type) {
    case 'chapter':
      showChapter(line.text);
      currentIndex++;
      break;
    case 'bg':
      setBG(line.src);
      currentIndex++;
      setTimeout(processLine, 800);
      break;
    case 'cg':
      showCG(line.src);
      currentIndex++;
      setTimeout(processLine, line.src ? 1200 : 600);
      break;
    case 'bgm':
      playBGM(line.src);
      currentIndex++;
      processLine();
      break;
    case 'char':
      handleChar(line);
      currentIndex++;
      setTimeout(processLine, 600);
      break;
    case 'text':
      showText(line);
      break;
    case 'wait':
      currentIndex++;
      setTimeout(processLine, line.ms);
      break;
    case 'choice':
      showChoices(line.choices);
      break;
    default:
      currentIndex++;
      processLine();
  }
}

function showChapter(text) {
  const overlay = document.getElementById('chapter-overlay');
  document.getElementById('chapter-text').innerHTML = text;
  overlay.classList.add('active');
  setTimeout(() => { overlay.classList.remove('active'); }, 3000);
}

function setBG(src) {
  const bg = document.getElementById('bg-layer');
  if(!bg) return;
  if(src) {
    bg.style.backgroundImage = "url(assets/backgrounds/" + src + ")";
    bg.style.opacity = '1';
  } else {
    bg.style.opacity = '0';
  }
}

function showCG(src) {
  const cg = document.getElementById('cg-layer');
  if(!cg) return;
  if(src) {
    cg.style.backgroundImage = "url(assets/backgrounds/" + src + ")";
    cg.classList.add('active');
    cgActive = true;
    document.getElementById('dialog-box').style.opacity = '0.85';
  } else {
    cg.classList.remove('active');
    cgActive = false;
    document.getElementById('dialog-box').style.opacity = '1';
  }
}

function handleChar(line) {
  const layer = document.getElementById('char-layer');
  if(!layer) return;
  const key = line.char + '_' + line.pos;

  if(line.action === 'hide') {
    const el = document.querySelector('.char[data-key="' + key + '"]');
    if(el) { el.classList.remove('active'); setTimeout(()=>{if(el.parentNode)el.remove()}, 700); }
    delete charsOnScreen[key];
    return;
  }

  // 同位置已有角色则先退场
  Object.keys(charsOnScreen).forEach(k => {
    if(k.endsWith('_' + line.pos) && k !== key) {
      const old = document.querySelector('.char[data-key="' + k + '"]');
      if(old) { old.classList.remove('active'); setTimeout(()=>{if(old.parentNode)old.remove()}, 700); }
      delete charsOnScreen[k];
    }
  });

  const charInfo = CHARACTERS[line.char];
  if(!charInfo) return;

  let el = document.querySelector('.char[data-key="' + key + '"]');
  if(!el) {
    el = document.createElement('img');
    el.className = 'char ' + line.pos;
    el.dataset.key = key;
    el.src = 'assets/characters/' + charInfo.img;
    el.alt = charInfo.name;
    layer.appendChild(el);
    charsOnScreen[key] = true;
  }
  void el.offsetWidth;
  el.classList.add('active');
}

function showText(line) {
  const speakerEl = document.getElementById('speaker');
  const textEl = document.getElementById('text');
  if(!speakerEl || !textEl) return;

  // 处理角色立绘
  if(line.char && line.pos) {
    const charKey = line.char + '_' + line.pos;
    const charInfo = CHARACTERS[line.char];
    if(charInfo) {
      // 如果立绘不在屏幕上，显示它
      if(!charsOnScreen[charKey]) {
        handleChar({ char: line.char, pos: line.pos });
      }
      speakerEl.textContent = charInfo.name;
      speakerEl.style.color = charInfo.color;
      speakerEl.style.borderLeftColor = charInfo.color;
    }
  } else if(line.speaker) {
    speakerEl.textContent = line.speaker;
    const found = Object.keys(CHARACTERS).find(k => CHARACTERS[k].name === line.speaker);
    const color = found ? CHARACTERS[found].color : '#a8edea';
    speakerEl.style.color = color;
    speakerEl.style.borderLeftColor = color;
  } else {
    speakerEl.textContent = '';
  }

  if(line.text) history.push({ speaker: line.speaker || '旁白', text: line.text });

  textEl.innerHTML = '';
  isTyping = true;

  const speed = Math.max(6, 110 - settings.textSpeed);
  let i = 0;
  const text = line.text || '';

  function typeChar() {
    if(!isTyping) return;
    if(i < text.length) {
      textEl.innerHTML = text.substring(0, i+1) + '<span class="cursor"></span>';
      i++;
      if(skipMode) { typeChar(); }
      else { typeTimer = setTimeout(typeChar, speed); }
    } else {
      textEl.textContent = text;
      isTyping = false;
      if(autoMode) {
        setTimeout(() => { if(autoMode) advance(); }, 2000);
      }
    }
  }
  typeChar();
}

function advance() {
  if(isTyping) {
    isTyping = false;
    clearTimeout(typeTimer);
    const line = SCRIPT[currentIndex];
    if(line && line.type === 'text') {
      document.getElementById('text').textContent = line.text;
    }
    return;
  }
  currentIndex++;
  if(currentIndex < SCRIPT.length) processLine();
  else showEndScreen();
}

// ========== 选项 ==========
function showChoices(choices) {
  const container = document.getElementById('choices');
  if(!container) return;
  container.innerHTML = '';
  choices.forEach((c) => {
    const btn = document.createElement('div');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => { container.classList.remove('active'); currentIndex = c.target; processLine(); };
    container.appendChild(btn);
  });
  container.classList.add('active');
}

// ========== 存档 ==========
function quickSave() {
  const data = { index: currentIndex, history: history.slice(-60) };
  localStorage.setItem('gal_save', JSON.stringify(data));
  showToast('已存档');
}

function showToast(msg) {
  const t = document.getElementById('status-toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('active');
  setTimeout(() => { t.classList.remove('active'); }, 1800);
}

function showEndScreen() {
  document.getElementById('end-screen').classList.add('active');
}

// ========== 自动/快进 ==========
function toggleAuto() {
  autoMode = !autoMode;
  skipMode = false;
  updateBtnStyle('autoBtn', autoMode);
  updateBtnStyle('skipBtn', false);
  if(autoMode && !isTyping) advance();
}

function toggleSkip() {
  skipMode = !skipMode;
  autoMode = false;
  updateBtnStyle('skipBtn', skipMode);
  updateBtnStyle('autoBtn', false);
}

function updateBtnStyle(id, active) {
  const btn = document.getElementById(id);
  if(btn) btn.style.color = active ? '#a8edea' : '#bbb';
}

// ========== 历史 ==========
function showHistory() {
  const list = document.getElementById('history-list');
  if(!list) return;
  list.innerHTML = history.map(h =>
    '<div class="history-item"><div class="history-speaker">' + (h.speaker || '旁白') + '</div><div class="history-text">' + h.text + '</div></div>'
  ).join('');
  document.getElementById('history').classList.add('active');
}
function hideHistory() { document.getElementById('history').classList.remove('active'); }

// ========== 设置 ==========
function showSettings() { document.getElementById('settings').classList.add('active'); }
function hideSettings() { document.getElementById('settings').classList.remove('active'); }
function updateSetting(key, val) {
  settings[key] = parseInt(val);
  if(key === 'textSpeed') {
    const label = val < 35 ? '慢' : val > 75 ? '快' : '中';
    document.getElementById('textSpeedVal').textContent = label;
  }
  if(key === 'bgmVol') {
    document.getElementById('bgmVolVal').textContent = val + '%';
    const bgm = document.getElementById('bgm');
    if(bgm) bgm.volume = val / 100;
  }
  if(key === 'seVol') document.getElementById('seVolVal').textContent = val + '%';
  saveSettings();
}
function saveSettings() { localStorage.setItem('gal_settings', JSON.stringify(settings)); }
function loadSettings() {
  const s = localStorage.getItem('gal_settings');
  if(s) { try { Object.assign(settings, JSON.parse(s)); } catch(e) {} }
  const ts = document.getElementById('textSpeed');
  const bv = document.getElementById('bgmVol');
  const sv = document.getElementById('seVol');
  if(ts) ts.value = settings.textSpeed;
  if(bv) bv.value = settings.bgmVol;
  if(sv) sv.value = settings.seVol;
  updateSetting('textSpeed', settings.textSpeed);
  updateSetting('bgmVol', settings.bgmVol);
  updateSetting('seVol', settings.seVol);
}

// ========== 键盘 ==========
document.addEventListener('keydown', e => {
  if(e.key === ' ' || e.key === 'Enter') {
    const title = document.getElementById('title-screen');
    if(title && title.style.display !== 'none') return;
    const end = document.getElementById('end-screen');
    if(end && end.classList.contains('active')) return;
    e.preventDefault();
    advance();
  }
  if(e.key === 'Control') { if(!skipMode) toggleSkip(); }
  if(e.key === 'a' || e.key === 'A') toggleAuto();
  if(e.key === 's' || e.key === 'S') quickSave();
});
document.addEventListener('keyup', e => {
  if(e.key === 'Control' && skipMode) toggleSkip();
});

document.addEventListener('contextmenu', e => e.preventDefault());

// 阻止所有事件冒泡到父页面（防止博客污染）
document.getElementById('game-root').addEventListener('click', e => {
  e.stopPropagation();
});

// 启动
init();
</script>

</div><!-- /game-root -->
