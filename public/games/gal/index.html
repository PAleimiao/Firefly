<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Angel Beats! - 毕业 - CXL避难所</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #000; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  color: #fff; user-select: none;
}

/* 背景层 */
#bg-layer {
  position: fixed; inset: 0; z-index: 1;
  background-size: cover; background-position: center;
  transition: opacity 1.2s ease;
}

/* 立绘层 */
#char-layer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 2;
  height: 75%; display: flex; align-items: flex-end; justify-content: center;
  pointer-events: none;
}
.char {
  position: absolute; bottom: 0; height: 90%;
  opacity: 0; transform: translateY(30px);
  transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  filter: drop-shadow(0 0 40px rgba(0,0,0,0.6));
}
.char.active { opacity: 1; transform: translateY(0); }
.char.left { left: 3%; }
.char.center { left: 50%; transform: translateX(-50%) translateY(30px); }
.char.center.active { transform: translateX(-50%) translateY(0); }
.char.right { right: 3%; }

/* 对话框 */
#dialog-box {
  position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
  width: 92%; max-width: 880px; z-index: 10;
  background: rgba(0,0,0,0.78);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px; padding: 18px 26px;
  backdrop-filter: blur(12px);
  cursor: pointer; min-height: 110px;
  transition: opacity 0.3s;
}
#dialog-box.hidden { opacity: 0; pointer-events: none; }
#speaker {
  font-size: 1.05rem; font-weight: bold;
  margin-bottom: 6px; padding-left: 4px;
  border-left: 3px solid; padding-left: 10px;
}
#text {
  font-size: 1rem; line-height: 1.75; color: #eee;
  min-height: 50px;
}
#text .cursor {
  display: inline-block; width: 2px; height: 1.1em;
  background: currentColor; margin-left: 2px;
  animation: blink 0.8s infinite;
  vertical-align: text-bottom;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* 选项 */
#choices {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  z-index: 20; display: none; flex-direction: column; gap: 12px;
  width: 80%; max-width: 380px;
}
#choices.active { display: flex; }
.choice-btn {
  background: rgba(0,0,0,0.85);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 10px; padding: 14px 22px;
  color: #fff; font-size: 1rem; cursor: pointer;
  text-align: center; transition: all 0.25s;
  backdrop-filter: blur(10px);
}
.choice-btn:hover {
  background: rgba(168,237,234,0.12);
  border-color: #a8edea; transform: translateX(6px);
}

/* 顶部UI */
#top-ui {
  position: fixed; top: 0; left: 0; right: 0; z-index: 30;
  display: none; justify-content: space-between; align-items: center;
  padding: 10px 18px; background: rgba(0,0,0,0.35);
}
#top-ui.active { display: flex; }
#top-ui button {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px; padding: 5px 12px; color: #bbb;
  font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
}
#top-ui button:hover { background: rgba(255,255,255,0.15); color: #fff; }
#chapter-title { font-size: 0.85rem; color: #888; letter-spacing: 2px; }

/* 设置面板 */
#settings {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(0,0,0,0.88);
  display: none; align-items: center; justify-content: center;
}
#settings.active { display: flex; }
.settings-box {
  background: rgba(18,18,28,0.96); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px; padding: 28px; width: 300px;
}
.settings-box h2 { font-size: 1.2rem; margin-bottom: 18px; text-align: center; }
.setting-row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; }
.setting-row label { font-size: 0.88rem; color: #aaa; }
.setting-row input[type="range"] { width: 110px; }
.setting-row span { font-size: 0.78rem; color: #888; width: 42px; text-align: right; }
.close-btn {
  width: 100%; margin-top: 12px; padding: 10px;
  background: rgba(168,237,234,0.12); border: 1px solid #a8edea;
  border-radius: 8px; color: #a8edea; cursor: pointer; font-size: 0.9rem;
}

/* 历史记录 */
#history {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(0,0,0,0.92);
  display: none; flex-direction: column;
}
#history.active { display: flex; }
#history-header {
  padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex; justify-content: space-between; align-items: center;
}
#history-list {
  flex: 1; overflow-y: auto; padding: 18px;
}
.history-item { margin-bottom: 10px; padding: 10px 12px; background: rgba(255,255,255,0.04); border-radius: 8px; }
.history-speaker { color: #a8edea; font-weight: bold; font-size: 0.82rem; margin-bottom: 3px; }
.history-text { color: #ccc; font-size: 0.88rem; }

/* 标题画面 */
#title-screen {
  position: fixed; inset: 0; z-index: 50;
  background: linear-gradient(180deg, #080818 0%, #151528 50%, #0a0a18 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#title-screen h1 {
  font-size: 2.8rem; letter-spacing: 10px; margin-bottom: 8px;
  background: linear-gradient(90deg, #a8edea, #fed6e3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#title-screen h2 {
  font-size: 0.95rem; color: #777; letter-spacing: 5px; margin-bottom: 50px;
}
.title-btn {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; padding: 12px 48px; margin: 7px 0;
  color: #ccc; font-size: 1rem; cursor: pointer;
  transition: all 0.3s; min-width: 220px; text-align: center;
}
.title-btn:hover {
  background: rgba(168,237,234,0.08); border-color: #a8edea; color: #fff;
  transform: translateY(-2px);
}

/* 章节标题动画 */
#chapter-overlay {
  position: fixed; inset: 0; z-index: 45;
  background: #000; display: none; align-items: center; justify-content: center;
}
#chapter-overlay.active { display: flex; }
#chapter-overlay h1 {
  font-size: 2.2rem; letter-spacing: 5px; text-align: center;
  animation: chapterFade 2.5s ease forwards;
}
@keyframes chapterFade {
  0% { opacity: 0; transform: scale(0.9); }
  30% { opacity: 1; transform: scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; }
}

/* 状态提示 */
#status-toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  z-index: 50; padding: 8px 20px; background: rgba(0,0,0,0.8);
  border: 1px solid rgba(168,237,234,0.3); border-radius: 20px;
  color: #a8edea; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
#status-toast.active { opacity: 1; }

@media (max-width: 600px) {
  #title-screen h1 { font-size: 2rem; letter-spacing: 5px; }
  .char { height: 80%; }
  #dialog-box { width: 96%; padding: 14px 18px; }
}
</style>
</head>
<body>

  <h2>毕业</h2>
  <div class="title-btn" onclick="startGame(); event.stopPropagation();">开始游戏</div>
  <div class="title-btn" onclick="loadGame(); event.stopPropagation();">继续游戏</div>
  <div class="title-btn" onclick="showSettings(); event.stopPropagation();">设置</div>

<!-- 历史 -->
<div id="history">

<!-- 状态提示 -->
<div id="status-toast"></div>

<!-- BGM -->
<audio id="bgm" loop></audio>

// ========== 角色配置 ==========
const CHARACTERS = {
  yuzuru: { name: '音无结弦', color: '#a8edea', img: 'yuzuru.png' },
  kanade: { name: '立华奏', color: '#fed6e3', img: 'kanade.png' },
  yuri: { name: '仲村由理', color: '#e94560', img: 'yuri.png' },
  hinata: { name: '日向秀树', color: '#4dabf7', img: 'hinata.png' },
  yui: { name: '由依', color: '#ffd43b', img: 'yui.png' },
};

// ========== 状态 ==========
let currentIndex = 0;
let isTyping = false;
let typeTimer = null;
let autoMode = false;
let skipMode = false;
let settings = { textSpeed: 50, bgmVol: 70, seVol: 80 };
let history = [];
let charsOnScreen = {};
let titleBGMStarted = false;

// ========== 初始化 ==========
function init() {
  loadSettings();
  const bgm = document.getElementById('bgm');
  if(bgm) bgm.volume = settings.bgmVol / 100;
}

function startGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('top-ui').classList.add('active');
  currentIndex = 0;
  history = [];
  charsOnScreen = {};
  document.getElementById('char-layer').innerHTML = '';
  titleBGMStarted = false;
  processLine();
}

function loadGame() {
  const save = localStorage.getItem('gal_save');
  if(save) {
    try {
      const data = JSON.parse(save);
      currentIndex = data.index || 0;
      history = data.history || [];
      document.getElementById('title-screen').style.display = 'none';
      document.getElementById('top-ui').classList.add('active');
      charsOnScreen = {};
      document.getElementById('char-layer').innerHTML = '';
      titleBGMStarted = false;
      processLine();
    } catch(e) {
      showToast('存档损坏，重新开始');
      startGame();
    }
  } else {
    showToast('没有存档');
    startGame();
  }
}

// ========== BGM ==========
function playBGM(src) {
  const bgm = document.getElementById('bgm');
  if(!bgm) return;
  const vol = settings.bgmVol / 100;

  if(bgm.src && bgm.src.includes(src) && !bgm.paused) return;

  if(!bgm.paused && bgm.src) {
    const fadeOut = setInterval(() => {
      if(bgm.volume > 0.05) { bgm.volume -= 0.05; }
      else {
        clearInterval(fadeOut);
        bgm.pause();
        switchBGM(bgm, src, vol);
      }
    }, 80);
  } else {
    switchBGM(bgm, src, vol);
  }
}

function switchBGM(bgm, src, vol) {
  bgm.src = 'assets/bgm/' + src;
  bgm.volume = 0;
  bgm.play().then(() => {
    const fadeIn = setInterval(() => {
      if(bgm.volume < vol - 0.03) { bgm.volume += 0.03; }
      else { bgm.volume = vol; clearInterval(fadeIn); }
    }, 60);
  }).catch(()=>{});
}

// ========== 核心处理 ==========
function processLine() {
  if(currentIndex >= SCRIPT.length) {
    showToast('故事结束');
    return;
  }
  const line = SCRIPT[currentIndex];

  switch(line.type) {
    case 'chapter':
      showChapter(line.text);
      currentIndex++;
      break;
    case 'bg':
      setBG(line.src);
      currentIndex++;
      setTimeout(processLine, 1000);
      break;
    case 'bgm':
      playBGM(line.src);
      currentIndex++;
      processLine();
      break;
    case 'char':
      handleChar(line);
      currentIndex++;
      setTimeout(processLine, 500);
      break;
    case 'text':
      showText(line);
      break;
    case 'choice':
      showChoices(line.choices);
      break;
    default:
      currentIndex++;
      processLine();
  }
}

function showChapter(text) {
  const overlay = document.getElementById('chapter-overlay');
  document.getElementById('chapter-text').innerHTML = text;
  overlay.classList.add('active');
  setTimeout(() => { overlay.classList.remove('active'); }, 2500);
}

function setBG(src) {
  const bg = document.getElementById('bg-layer');
  if(bg) bg.style.backgroundImage = "url(assets/backgrounds/" + src + ")";
}

function handleChar(line) {
  const layer = document.getElementById('char-layer');
  if(!layer) return;
  const key = line.char + '_' + line.pos;

  if(line.action === 'hide') {
    const el = document.querySelector('.char[data-key="' + key + '"]');
    if(el) { el.classList.remove('active'); setTimeout(()=>el.remove(), 600); }
    delete charsOnScreen[key];
    return;
  }

  Object.keys(charsOnScreen).forEach(k => {
    if(k.endsWith('_' + line.pos) && k !== key) {
      const old = document.querySelector('.char[data-key="' + k + '"]');
      if(old) { old.classList.remove('active'); setTimeout(()=>old.remove(), 600); }
      delete charsOnScreen[k];
    }
  });

  const charInfo = CHARACTERS[line.char];
  if(!charInfo) return;

  let el = document.querySelector('.char[data-key="' + key + '"]');
  if(!el) {
    el = document.createElement('img');
    el.className = 'char ' + line.pos;
    el.dataset.key = key;
    el.src = 'assets/characters/' + charInfo.img;
    el.alt = charInfo.name;
    layer.appendChild(el);
    charsOnScreen[key] = true;
  }
  void el.offsetWidth;
  el.classList.add('active');
}

function showText(line) {
  const speakerEl = document.getElementById('speaker');
  const textEl = document.getElementById('text');
  if(!speakerEl || !textEl) return;

  if(line.speaker) {
    const charInfo = CHARACTERS[Object.keys(CHARACTERS).find(k=>CHARACTERS[k].name===line.speaker)];
    speakerEl.textContent = line.speaker;
    const color = charInfo ? charInfo.color : '#a8edea';
    speakerEl.style.color = color;
    speakerEl.style.borderLeftColor = color;
  } else {
    speakerEl.textContent = '';
  }

  if(line.text) history.push({ speaker: line.speaker, text: line.text });

  textEl.innerHTML = '';
  isTyping = true;

  const speed = Math.max(8, 110 - settings.textSpeed);
  let i = 0;
  const text = line.text || '';

  function typeChar() {
    if(!isTyping) return;
    if(i < text.length) {
      textEl.innerHTML = text.substring(0, i+1) + '<span class="cursor"></span>';
      i++;
      if(skipMode) { typeChar(); }
      else { typeTimer = setTimeout(typeChar, speed); }
    } else {
      textEl.textContent = text;
      isTyping = false;
      if(autoMode) {
        setTimeout(() => { if(autoMode) advance(); }, 1800);
      }
    }
  }
  typeChar();
}

function advance() {
  if(isTyping) {
    isTyping = false;
    clearTimeout(typeTimer);
    const line = SCRIPT[currentIndex];
    if(line && line.type === 'text') {
      document.getElementById('text').textContent = line.text;
    }
    return;
  }
  currentIndex++;
  if(currentIndex < SCRIPT.length) processLine();
}

// ========== 选项 ==========
function showChoices(choices) {
  const container = document.getElementById('choices');
  if(!container) return;
  container.innerHTML = '';
  choices.forEach((c) => {
    const btn = document.createElement('div');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => { container.classList.remove('active'); currentIndex = c.target; processLine(); };
    container.appendChild(btn);
  });
  container.classList.add('active');
}

// ========== 存档 ==========
function quickSave() {
  const data = { index: currentIndex, history: history.slice(-50) };
  localStorage.setItem('gal_save', JSON.stringify(data));
  showToast('已存档');
}

function showToast(msg) {
  const t = document.getElementById('status-toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('active');
  setTimeout(() => { t.classList.remove('active'); }, 1500);
}

// ========== 自动/快进 ==========
function toggleAuto() {
  autoMode = !autoMode;
  skipMode = false;
  updateBtnStyle('autoBtn', autoMode);
  updateBtnStyle('skipBtn', false);
  if(autoMode && !isTyping) advance();
}

function toggleSkip() {
  skipMode = !skipMode;
  autoMode = false;
  updateBtnStyle('skipBtn', skipMode);
  updateBtnStyle('autoBtn', false);
}

function updateBtnStyle(id, active) {
  const btn = document.getElementById(id);
  if(btn) btn.style.color = active ? '#a8edea' : '#bbb';
}

// ========== 历史 ==========
function showHistory() {
  const list = document.getElementById('history-list');
  if(!list) return;
  list.innerHTML = history.map(h => 
    '<div class="history-item"><div class="history-speaker">' + (h.speaker || '旁白') + '</div><div class="history-text">' + h.text + '</div></div>'
  ).join('');
  document.getElementById('history').classList.add('active');
}
function hideHistory() { document.getElementById('history').classList.remove('active'); }

// ========== 设置 ==========
function showSettings() { document.getElementById('settings').classList.add('active'); }
function hideSettings() { document.getElementById('settings').classList.remove('active'); }
function updateSetting(key, val) {
  settings[key] = parseInt(val);
  if(key === 'textSpeed') {
    const label = val < 40 ? '慢' : val > 70 ? '快' : '中';
    document.getElementById('textSpeedVal').textContent = label;
  }
  if(key === 'bgmVol') {
    document.getElementById('bgmVolVal').textContent = val + '%';
    const bgm = document.getElementById('bgm');
    if(bgm) bgm.volume = val / 100;
  }
  if(key === 'seVol') document.getElementById('seVolVal').textContent = val + '%';
  saveSettings();
}
function saveSettings() { localStorage.setItem('gal_settings', JSON.stringify(settings)); }
function loadSettings() {
  const s = localStorage.getItem('gal_settings');
  if(s) {
    try { Object.assign(settings, JSON.parse(s)); } catch(e) {}
  }
  const ts = document.getElementById('textSpeed');
  const bv = document.getElementById('bgmVol');
  const sv = document.getElementById('seVol');
  if(ts) ts.value = settings.textSpeed;
  if(bv) bv.value = settings.bgmVol;
  if(sv) sv.value = settings.seVol;
  updateSetting('textSpeed', settings.textSpeed);
  updateSetting('bgmVol', settings.bgmVol);
  updateSetting('seVol', settings.seVol);
}

// ========== 键盘 ==========
document.addEventListener('keydown', e => {
  if(e.key === ' ' || e.key === 'Enter') {
    const title = document.getElementById('title-screen');
    if(title && title.style.display !== 'none') return;
    e.preventDefault();
    advance();
  }
  if(e.key === 'Control') { if(!skipMode) toggleSkip(); }
  if(e.key === 'a' || e.key === 'A') toggleAuto();
  if(e.key === 's' || e.key === 'S') quickSave();
});
document.addEventListener('keyup', e => {
  if(e.key === 'Control' && skipMode) toggleSkip();
});

document.addEventListener('contextmenu', e => e.preventDefault());

// 启动
init();
</script>
</body>
