<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>钢琴 - CXL避难所游戏站</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0c0c14;
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; color: #e0e0e0; overflow: hidden;
}
.top-bar {
  width: 100%; max-width: 900px; padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.top-bar h1 {
  font-size: 1.3rem; font-weight: 600; color: #fff;
  letter-spacing: 2px;
}
.controls {
  display: flex; align-items: center; gap: 12px;
}
.btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px; padding: 6px 16px;
  color: #ccc; font-size: 0.8rem; cursor: pointer;
  transition: all 0.2s;
}
.btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
input[type="file"] { display: none; }
.file-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px; padding: 6px 16px;
  color: #ccc; font-size: 0.8rem; cursor: pointer;
  transition: all 0.2s;
}
.file-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
.speed-wrap { display: flex; align-items: center; gap: 6px; }
.speed-wrap span { font-size: 0.75rem; color: #888; }
.speed-wrap input[type="range"] {
  width: 70px; height: 4px; -webkit-appearance: none;
  background: rgba(255,255,255,0.1); border-radius: 2px; outline: none;
}
.speed-wrap input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px;
  background: #888; border-radius: 50%; cursor: pointer;
}

/* CAVA 频谱 */
#visualizer {
  width: 100%; max-width: 900px; height: 100px;
  display: flex; align-items: flex-end; justify-content: center;
  gap: 3px; padding: 10px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.bar {
  width: 8px; background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
  border-radius: 2px 2px 0 0;
  transition: height 0.05s ease;
  opacity: 0.7;
}

/* 钢琴 */
.piano-wrap {
  flex: 1; display: flex; align-items: flex-end; justify-content: center;
  padding: 20px; width: 100%; max-width: 900px;
}
.piano {
  position: relative; display: flex;
  background: #1a1a2e; border-radius: 8px 8px 4px 4px;
  padding: 4px 4px 0 4px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.white-key {
  width: 44px; height: 180px;
  background: linear-gradient(180deg, #f5f5f5 0%, #e0e0e0 100%);
  border: 1px solid #bbb; border-bottom: 3px solid #999;
  border-radius: 0 0 4px 4px; margin: 0 1px;
  cursor: pointer; position: relative;
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 8px; font-size: 0.6rem; color: #666;
  transition: all 0.05s;
}
.white-key:active, .white-key.active {
  background: linear-gradient(180deg, #ddd 0%, #ccc 100%);
  border-bottom: 1px solid #999;
  transform: translateY(2px);
}
.white-key .label { position: absolute; bottom: 6px; font-size: 0.55rem; color: #999; }
.black-key {
  width: 26px; height: 110px;
  background: linear-gradient(180deg, #333 0%, #111 100%);
  border: 1px solid #000; border-bottom: 3px solid #000;
  border-radius: 0 0 3px 3px; position: absolute; top: 4px;
  cursor: pointer; z-index: 10;
  transition: all 0.05s;
}
.black-key:active, .black-key.active {
  background: linear-gradient(180deg, #222 0%, #000 100%);
  border-bottom: 1px solid #000;
  transform: translateY(2px);
}
.black-key .label { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 0.5rem; color: #666; }

.status-bar {
  width: 100%; max-width: 900px; padding: 8px 20px;
  text-align: center; font-size: 0.8rem; color: #555;
  border-top: 1px solid rgba(255,255,255,0.04);
}

@media (max-width: 700px) {
  .white-key { width: 34px; height: 140px; font-size: 0.5rem; }
  .black-key { width: 20px; height: 85px; }
  .bar { width: 5px; }
}
</style>
</head>
<body>
<div class="top-bar">
  <h1>PIANO</h1>
  <div class="controls">
    <label class="file-btn" for="midiFile">导入 MIDI</label>
    <input type="file" id="midiFile" accept=".mid,.midi" onchange="loadMidi(event)">
    <button class="btn" id="playBtn" onclick="togglePlay()" disabled>播放</button>
    <button class="btn" onclick="stopPlay()">停止</button>
    <div class="speed-wrap">
      <span id="speedVal">1.0x</span>
      <input type="range" id="speedRange" min="0.3" max="2.0" step="0.1" value="1.0" oninput="updateSpeed()">
    </div>
  </div>
</div>

<div id="visualizer"></div>

<div class="piano-wrap">
  <div class="piano" id="piano"></div>
</div>

<div class="status-bar" id="status">点击琴键演奏，或导入 MIDI 文件自动播放</div>

<script>
// ========== Audio ==========
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function ensureAudio() {
  if(!audioCtx) audioCtx = new AudioCtx();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

// 模拟钢琴音色：多个泛音叠加 + ADSR
function playPiano(note, duration=0.8, velocity=0.5) {
  ensureAudio();
  const baseFreq = 440 * Math.pow(2, (note - 69) / 12);
  const t = audioCtx.currentTime;
  const dur = Math.max(duration, 0.3);
  const masterGain = audioCtx.createGain();
  masterGain.connect(audioCtx.destination);
  masterGain.gain.setValueAtTime(velocity * 0.5, t);
  masterGain.gain.exponentialRampToValueAtTime(0.001, t + dur + 0.5);

  // 基频 + 泛音 模拟钢琴
  const harmonics = [
    { type: 'sine', freq: 1.0, gain: 0.6 },
    { type: 'triangle', freq: 2.0, gain: 0.25 },
    { type: 'sine', freq: 3.0, gain: 0.12 },
    { type: 'triangle', freq: 4.0, gain: 0.06 },
    { type: 'sine', freq: 6.0, gain: 0.03 },
  ];

  harmonics.forEach(h => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = h.type;
    osc.frequency.value = baseFreq * h.freq;
    // 低中高音微调
    if(note < 48) { // 低音区加强
      g.gain.setValueAtTime(h.gain * velocity * 1.3, t);
    } else if(note > 72) { // 高音区减弱泛音
      g.gain.setValueAtTime(h.gain * velocity * 0.6, t);
    } else {
      g.gain.setValueAtTime(h.gain * velocity, t);
    }
    g.gain.exponentialRampToValueAtTime(0.001, t + dur * (0.5 + h.freq * 0.1));
    osc.connect(g); g.connect(masterGain);
    osc.start(t); osc.stop(t + dur + 0.5);
  });

  // 低频增强（低音区）
  if(note < 60) {
    const sub = audioCtx.createOscillator();
    const subG = audioCtx.createGain();
    sub.type = 'sine'; sub.frequency.value = baseFreq * 0.5;
    subG.gain.setValueAtTime(velocity * 0.15, t);
    subG.gain.exponentialRampToValueAtTime(0.001, t + dur);
    sub.connect(subG); subG.connect(masterGain);
    sub.start(t); sub.stop(t + dur);
  }

  // 触发频谱条
  triggerSpectrum(note, velocity);
}

// ========== CAVA Visualizer ==========
const NUM_BARS = 64;
let bars = [];
let spectrumData = new Array(NUM_BARS).fill(0);

function initVisualizer() {
  const container = document.getElementById('visualizer');
  container.innerHTML = '';
  bars = [];
  for(let i=0; i<NUM_BARS; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = '2px';
    container.appendChild(bar);
    bars.push(bar);
  }
}

function triggerSpectrum(note, velocity) {
  // 根据音符频率映射到频谱条
  const idx = Math.floor(((note - 48) / 48) * NUM_BARS);
  if(idx >= 0 && idx < NUM_BARS) {
    spectrumData[idx] = Math.max(spectrumData[idx], velocity * 80 + 20);
    // 扩散到相邻条
    if(idx > 0) spectrumData[idx-1] = Math.max(spectrumData[idx-1], velocity * 50);
    if(idx < NUM_BARS-1) spectrumData[idx+1] = Math.max(spectrumData[idx+1], velocity * 50);
  }
}

function animateSpectrum() {
  for(let i=0; i<NUM_BARS; i++) {
    spectrumData[i] *= 0.92; // 衰减
    spectrumData[i] = Math.max(spectrumData[i], 2 + Math.sin(Date.now()*0.003 + i*0.2)*2);
    bars[i].style.height = Math.min(spectrumData[i], 90) + 'px';
    // 颜色随高度变化
    const h = spectrumData[i];
    if(h > 60) bars[i].style.background = 'linear-gradient(180deg, #ff6b6b, #ee5a5a)';
    else if(h > 35) bars[i].style.background = 'linear-gradient(180deg, #667eea, #764ba2)';
    else bars[i].style.background = 'linear-gradient(180deg, #4a90e2, #357abd)';
  }
  requestAnimationFrame(animateSpectrum);
}

// ========== Piano Keys ==========
const START_NOTE = 48; // C3
const END_NOTE = 84;   // C6 (3 octaves)
const WHITE_KEYS = [];
const NOTE_TO_KEY = {};

function isBlack(note) {
  const n = note % 12;
  return n===1 || n===3 || n===6 || n===8 || n===10;
}

function noteName(note) {
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  return names[note%12];
}

const piano = document.getElementById('piano');
let whiteKeyIndex = 0;

for(let n=START_NOTE; n<=END_NOTE; n++) {
  if(!isBlack(n)) {
    const k = document.createElement('div');
    k.className = 'white-key';
    k.dataset.note = n;
    const label = document.createElement('span');
    label.className = 'label'; label.textContent = noteName(n);
    k.appendChild(label);
    k.onmousedown = ()=>pressKey(n); k.onmouseup = ()=>releaseKey(n);
    k.ontouchstart = (e)=>{e.preventDefault(); pressKey(n);};
    k.ontouchend = (e)=>{e.preventDefault(); releaseKey(n);};
    piano.appendChild(k);
    WHITE_KEYS.push({note:n, el:k, index:whiteKeyIndex});
    NOTE_TO_KEY[n] = {el:k, type:'white'};
    whiteKeyIndex++;
  }
}

for(let n=START_NOTE; n<=END_NOTE; n++) {
  if(isBlack(n)) {
    const prevWhite = WHITE_KEYS.find(w=>w.note===n-1);
    if(prevWhite) {
      const k = document.createElement('div');
      k.className = 'black-key';
      k.dataset.note = n;
      const left = (prevWhite.index * 46) + 44 - 13;
      k.style.left = left + 'px';
      const label = document.createElement('span');
      label.className = 'label'; label.textContent = noteName(n);
      k.appendChild(label);
      k.onmousedown = ()=>pressKey(n); k.onmouseup = ()=>releaseKey(n);
      k.ontouchstart = (e)=>{e.preventDefault(); pressKey(n);};
      k.ontouchend = (e)=>{e.preventDefault(); releaseKey(n);};
      piano.appendChild(k);
      NOTE_TO_KEY[n] = {el:k, type:'black'};
    }
  }
}

function pressKey(note) {
  const info = NOTE_TO_KEY[note]; if(!info) return;
  info.el.classList.add('active');
  playPiano(note, 0.8, 0.5);
}
function releaseKey(note) {
  const info = NOTE_TO_KEY[note]; if(!info) return;
  info.el.classList.remove('active');
}

// Keyboard mapping
const KEY_MAP = {
  'z':48,'x':50,'c':52,'v':53,'b':55,'n':57,'m':59, // C3-B3
  ',':60,'.':62,'/':64, // C4-E4
  'a':49,'s':51,'d':54,'f':56,'g':58, // black lower
  'q':60,'w':62,'e':64,'r':65,'t':67,'y':69,'u':71,'i':72,'o':74,'p':76,'[':77,']':79, // C4-G5
  '2':61,'3':63,'5':66,'6':68,'7':70,'9':73,'0':75,'=':78, // black upper
  'k':72,'l':74,';':76,"'":77, // extra
};
document.addEventListener('keydown', e=>{
  if(e.repeat) return;
  const n = KEY_MAP[e.key.toLowerCase()];
  if(n && n>=START_NOTE && n<=END_NOTE) pressKey(n);
});
document.addEventListener('keyup', e=>{
  const n = KEY_MAP[e.key.toLowerCase()];
  if(n && n>=START_NOTE && n<=END_NOTE) releaseKey(n);
});

// ========== MIDI Parser ==========
function parseMidi(buffer) {
  const data = new Uint8Array(buffer); let pos = 0;
  function read32() { return (data[pos++]<<24)|(data[pos++]<<16)|(data[pos++]<<8)|data[pos++]; }
  function read16() { return (data[pos++]<<8)|data[pos++]; }
  function readVarLen() { let v=0, b; do{ b=data[pos++]; v=(v<<7)|(b&0x7f); }while(b&0x80); return v; }
  if(String.fromCharCode(...data.slice(0,4))!=='MThd') throw new Error('不是标准MIDI文件');
  pos+=4; read32(); const format=read16(), numTracks=read16(), division=read16(); const ticksPerBeat = division & 0x7fff; let tempo = 500000; const allNotes = [];
  for(let t=0; t<numTracks; t++) {
    if(String.fromCharCode(...data.slice(pos,pos+4))!=='MTrk') { pos++; t--; continue; }
    pos+=4; const trackLen = read32(); const endPos = pos + trackLen; let trackTime = 0; let runningStatus = 0; const noteOnEvents = {};
    while(pos < endPos) { const delta = readVarLen(); trackTime += delta; let status = data[pos]; if(status & 0x80) { runningStatus = status; pos++; } else status = runningStatus; const type = status & 0xf0; const channel = status & 0x0f;
      if(type === 0x90) { const note = data[pos++]; const vel = data[pos++]; if(vel > 0) { noteOnEvents[`${channel}-${note}`] = { time: trackTime, velocity: vel/127 }; } else { const key = `${channel}-${note}`; if(noteOnEvents[key]) { allNotes.push({ note, time: noteOnEvents[key].time, duration: trackTime - noteOnEvents[key].time, velocity: noteOnEvents[key].velocity }); delete noteOnEvents[key]; } } }
      else if(type === 0x80) { const note = data[pos++]; pos++; const key = `${channel}-${note}`; if(noteOnEvents[key]) { allNotes.push({ note, time: noteOnEvents[key].time, duration: trackTime - noteOnEvents[key].time, velocity: noteOnEvents[key].velocity }); delete noteOnEvents[key]; } }
      else if(status === 0xff) { const metaType = data[pos++]; const metaLen = readVarLen(); if(metaType === 0x51) { tempo = (data[pos]<<16)|(data[pos+1]<<8)|data[pos+2]; } pos += metaLen; }
      else if(status === 0xf0 || status === 0xf7) { const len = readVarLen(); pos += len; }
      else { if(type===0xc0 || type===0xd0) pos++; else if(type===0xa0 || type===0xb0 || type===0xe0) pos+=2; else pos++; }
    }
  }
  const msPerTick = tempo / ticksPerBeat; allNotes.forEach(n => { n.time = Math.round(n.time * msPerTick); n.duration = Math.round(n.duration * msPerTick); });
  return allNotes.filter(n=>n.note>=START_NOTE && n.note<=END_NOTE).sort((a,b)=>a.time-b.time);
}

let midiNotes = [], isPlaying = false, playStartTime = 0, speed = 1.0, animationId;

function loadMidi(e) {
  const file = e.target.files[0]; if(!file) return;
  document.getElementById('status').textContent = '正在解析: ' + file.name;
  const reader = new FileReader();
  reader.onload = ev => {
    try { midiNotes = parseMidi(ev.target.result); midiNotes.forEach(n=>n.played=false); document.getElementById('status').textContent = '解析成功, 共 ' + midiNotes.length + ' 个音符'; document.getElementById('playBtn').disabled = false; }
    catch(err) { document.getElementById('status').textContent = '解析失败: ' + err.message; }
  };
  reader.readAsArrayBuffer(file);
}

function animate() {
  if(!isPlaying) return;
  const now = (Date.now() - playStartTime) * speed;
  midiNotes.forEach(mn => {
    if(!mn.played && mn.time <= now + 50) {
      mn.played = true;
      playPiano(mn.note, mn.duration/1000, mn.velocity);
      const info = NOTE_TO_KEY[mn.note];
      if(info) { info.el.classList.add('active'); setTimeout(()=>info.el.classList.remove('active'), Math.min(mn.duration, 300)); }
    }
  });
  if(midiNotes.every(mn=>mn.played)) { stopPlay(); document.getElementById('status').textContent = '播放完成'; return; }
  animationId = requestAnimationFrame(animate);
}

function togglePlay() {
  if(isPlaying) { pausePlay(); return; }
  if(!midiNotes.length) return;
  ensureAudio(); isPlaying = true; playStartTime = Date.now(); midiNotes.forEach(n=>n.played=false);
  document.getElementById('playBtn').textContent = '暂停'; document.getElementById('status').textContent = '播放中...';
  animate();
}
function pausePlay() { isPlaying = false; cancelAnimationFrame(animationId); document.getElementById('playBtn').textContent = '继续'; document.getElementById('status').textContent = '已暂停'; }
function stopPlay() { isPlaying = false; cancelAnimationFrame(animationId); midiNotes.forEach(n=>n.played=false); document.getElementById('playBtn').textContent = '播放'; document.getElementById('playBtn').disabled = midiNotes.length===0; document.getElementById('status').textContent = '已停止'; }
function updateSpeed() { speed = parseFloat(document.getElementById('speedRange').value); document.getElementById('speedVal').textContent = speed.toFixed(1) + 'x'; }

initVisualizer();
animateSpectrum();
</script>
</body>
</html>
