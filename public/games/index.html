<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏中心 - CXL避难所</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; min-height: 100vh; background: #0a0a14;
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  color: #fff; overflow-x: hidden;
}
#app {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  padding: 50px 20px 80px;
}
h1 {
  font-size: 2.4rem; letter-spacing: 12px; margin-bottom: 10px;
  background: linear-gradient(90deg, #a8edea, #fed6e3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.subtitle { font-size: 0.9rem; color: #666; letter-spacing: 4px; margin-bottom: 50px; }

.game-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px; width: 100%; max-width: 900px;
}
.game-card {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px; padding: 28px 24px; text-align: center; cursor: pointer;
  transition: all 0.4s; position: relative; overflow: hidden; text-decoration: none;
  display: block;
}
.game-card:hover {
  background: rgba(168,237,234,0.06); border-color: rgba(168,237,234,0.3);
  transform: translateY(-4px); box-shadow: 0 8px 32px rgba(168,237,234,0.08);
}
.game-icon {
  font-size: 3rem; margin-bottom: 16px;
}
.game-title {
  font-size: 1.15rem; font-weight: bold; color: #fff; margin-bottom: 8px;
  letter-spacing: 2px;
}
.game-desc {
  font-size: 0.82rem; color: #888; line-height: 1.6; margin-bottom: 12px;
}
.game-tag {
  display: inline-block; padding: 4px 14px; border-radius: 20px;
  font-size: 0.72rem; letter-spacing: 1px; margin-top: 4px;
}
.tag-ready {
  background: rgba(140,233,154,0.12); border: 1px solid rgba(140,233,154,0.3); color: #8ce99a;
}
.tag-wip {
  background: rgba(255,212,59,0.12); border: 1px solid rgba(255,212,59,0.3); color: #ffd43b;
}
.tag-new {
  background: rgba(168,237,234,0.12); border: 1px solid rgba(168,237,234,0.3); color: #a8edea;
}

.back-btn {
  margin-top: 50px; padding: 12px 40px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px; color: #888; font-size: 0.95rem; cursor: pointer;
  transition: all 0.3s; letter-spacing: 2px; text-decoration: none;
}
.back-btn:hover { background: rgba(168,237,234,0.08); border-color: rgba(168,237,234,0.4); color: #fff; }

@media (max-width: 600px) {
  h1 { font-size: 1.8rem; letter-spacing: 6px; }
  .game-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="app">
  <h1>游戏中心</h1>
  <div class="subtitle">CXL 避难所 · 点击即玩</div>

  <div class="game-grid">

    <!-- 钢琴 -->
    <a href="piano.html" class="game-card">
      <div class="game-icon">🎹</div>
      <div class="game-title">网页钢琴</div>
      <div class="game-desc">支持键盘演奏、MIDI导入<br>低中高音域完整覆盖</div>
      <span class="game-tag tag-ready">可玩</span>
    </a>

    <!-- WebGAL -->
    <a href="gal/webgal/" class="game-card">
      <div class="game-icon">📖</div>
      <div class="game-title">WebGAL 演示</div>
      <div class="game-desc">基于 WebGAL 引擎的演示游戏<br>完整立绘、语音、BGM体验</div>
      <span class="game-tag tag-new">NEW</span>
    </a>

    <!-- AngelBeats -->
    <a href="gal/" class="game-card">
      <div class="game-icon">🎮</div>
      <div class="game-title">Angel Beats!</div>
      <div class="game-desc">毕业 · 第13章<br>死后世界战线的最后告别</div>
      <span class="game-tag tag-wip">施工中</span>
    </a>

  </div>

  <a href="/" class="back-btn">返回博客首页</a>
</div>

</body>
</html>
