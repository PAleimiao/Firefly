<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 - CXL避难所游戏站</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  font-family: 'Segoe UI', system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; color: #fff; overflow: hidden;
}
.header {
  margin-top: 20px; text-align: center;
}
.header h1 {
  font-size: 2.5rem; background: linear-gradient(90deg, #e94560, #ff6b6b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(233,69,96,0.3);
}
.score-board {
  display: flex; gap: 20px; margin: 15px 0;
}
.score-box {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px; padding: 10px 25px;
  backdrop-filter: blur(10px);
}
.score-box span { display: block; font-size: 0.75rem; color: #aaa; }
.score-box strong { font-size: 1.4rem; color: #fff; }
.btn {
  background: linear-gradient(135deg, #e94560, #c73e54);
  border: none; border-radius: 8px; padding: 10px 24px;
  color: #fff; font-size: 1rem; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 15px rgba(233,69,96,0.3);
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,69,96,0.4); }
.btn:active { transform: scale(0.95); }
.game-container {
  position: relative; margin-top: 15px;
}
.grid-bg {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px; padding: 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
}
.cell {
  width: 80px; height: 80px; border-radius: 10px;
  background: rgba(255,255,255,0.06);
}
.tile-container {
  position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px;
  pointer-events: none;
}
.tile {
  position: absolute; width: 80px; height: 80px;
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; font-weight: bold; color: #fff;
  transition: all 0.15s ease; z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.tile-new { animation: pop 0.3s ease; }
.tile-merged { animation: pop 0.3s ease; z-index: 20; }
@keyframes pop {
  0% { transform: scale(0); } 50% { transform: scale(1.1); } 100% { transform: scale(1); }
}
/* 颜色 */
.tile-2 { background: linear-gradient(135deg, #4a90e2, #357abd); }
.tile-4 { background: linear-gradient(135deg, #50c878, #3da35d); }
.tile-8 { background: linear-gradient(135deg, #f5a623, #d48c1a); }
.tile-16 { background: linear-gradient(135deg, #e94560, #c73e54); }
.tile-32 { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
.tile-64 { background: linear-gradient(135deg, #e74c3c, #c0392b); }
.tile-128 { background: linear-gradient(135deg, #f39c12, #d68910); font-size: 1.4rem; }
.tile-256 { background: linear-gradient(135deg, #1abc9c, #16a085); font-size: 1.4rem; }
.tile-512 { background: linear-gradient(135deg, #3498db, #2980b9); font-size: 1.4rem; }
.tile-1024 { background: linear-gradient(135deg, #e67e22, #d35400); font-size: 1.2rem; }
.tile-2048 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #1a1a2e; font-size: 1.2rem; box-shadow: 0 0 20px rgba(255,215,0,0.5); }
.tile-super { background: linear-gradient(135deg, #ff006e, #8338ec); font-size: 1rem; }

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  display: none; align-items: center; justify-content: center; z-index: 100;
  backdrop-filter: blur(5px);
}
.overlay.active { display: flex; }
.overlay-content {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
  padding: 40px; text-align: center; max-width: 320px;
}
.overlay-content h2 { font-size: 2rem; margin-bottom: 10px; }
.overlay-content p { color: #aaa; margin-bottom: 20px; }

.howto {
  margin-top: 15px; color: #888; font-size: 0.85rem;
  text-align: center; padding: 0 20px;
}

@media (max-width: 400px) {
  .cell, .tile { width: 65px; height: 65px; }
  .tile { font-size: 1.3rem; }
  .tile-128, .tile-256, .tile-512 { font-size: 1.1rem; }
  .tile-1024, .tile-2048 { font-size: 1rem; }
}
</style>
</head>
<body>
<div class="header">
  <h1>2048</h1>
  <div class="score-board">
    <div class="score-box"><span>分数</span><strong id="score">0</strong></div>
    <div class="score-box"><span>最高分</span><strong id="best">0</strong></div>
  </div>
  <button class="btn" onclick="newGame()">新游戏</button>
</div>

<div class="game-container" id="gameContainer">
  <div class="grid-bg" id="gridBg"></div>
  <div class="tile-container" id="tileContainer"></div>
</div>

<div class="howto">👆 使用方向键或滑动屏幕操作</div>

<div class="overlay" id="overlay">
  <div class="overlay-content">
    <h2 id="msgTitle">游戏结束</h2>
    <p id="msgText">再试一次吧！</p>
    <button class="btn" onclick="newGame()">再来一局</button>
  </div>
</div>

<script>
const SIZE = 4;
let board = [], score = 0, best = parseInt(localStorage.getItem('best2048')||0);
let touchStartX, touchStartY;

document.getElementById('best').textContent = best;

function initGrid() {
  const bg = document.getElementById('gridBg');
  bg.innerHTML = '';
  for(let i=0;i<SIZE*SIZE;i++){
    const c = document.createElement('div'); c.className='cell'; bg.appendChild(c);
  }
}

function newGame() {
  board = Array(SIZE).fill().map(()=>Array(SIZE).fill(0));
  score = 0; updateScore();
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('tileContainer').innerHTML = '';
  addRandom(); addRandom(); render();
}

function addRandom() {
  const empty = [];
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!board[r][c]) empty.push({r,c});
  if(empty.length) {
    const {r,c} = empty[Math.floor(Math.random()*empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
    return {r,c,val:board[r][c],isNew:true};
  }
}

function render() {
  const tc = document.getElementById('tileContainer'); tc.innerHTML = '';
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(board[r][c]){
        const t = document.createElement('div');
        t.className = `tile tile-${board[r][c] <= 2048 ? board[r][c] : 'super'}`;
        t.textContent = board[r][c];
        t.style.left = (c*90)+'px'; t.style.top = (r*90)+'px';
        if(window.innerWidth <= 400) { t.style.left=(c*75)+'px'; t.style.top=(r*75)+'px'; }
        tc.appendChild(t);
      }
    }
  }
}

function updateScore() {
  document.getElementById('score').textContent = score;
  if(score > best) { best = score; localStorage.setItem('best2048', best); document.getElementById('best').textContent = best; }
}

function slideRowLeft(row) {
  let arr = row.filter(x=>x);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i] === arr[i+1]){ arr[i]*=2; score+=arr[i]; arr[i+1]=0; }
  }
  arr = arr.filter(x=>x);
  while(arr.length < SIZE) arr.push(0);
  return arr;
}

function moveLeft() { let moved=false; for(let r=0;r<SIZE;r++){ const old=[...board[r]]; board[r]=slideRowLeft(board[r]); if(old.join(',')!==board[r].join(',')) moved=true; } return moved; }
function moveRight() { let moved=false; for(let r=0;r<SIZE;r++){ board[r]=board[r].reverse(); const old=[...board[r]]; board[r]=slideRowLeft(board[r]); board[r]=board[r].reverse(); if(old.join(',')!==board[r].reverse().join(',')) moved=true; } return moved; }
function moveUp() { let moved=false; for(let c=0;c<SIZE;c++){ let col=[]; for(let r=0;r<SIZE;r++) col.push(board[r][c]); const old=[...col]; col=slideRowLeft(col); for(let r=0;r<SIZE;r++) board[r][c]=col[r]; if(old.join(',')!==col.join(',')) moved=true; } return moved; }
function moveDown() { let moved=false; for(let c=0;c<SIZE;c++){ let col=[]; for(let r=0;r<SIZE;r++) col.push(board[r][c]); const old=[...col]; col=col.reverse(); col=slideRowLeft(col); col=col.reverse(); for(let r=0;r<SIZE;r++) board[r][c]=col[r]; if(old.join(',')!==[...Array(SIZE)].map((_,i)=>board[i][c]).join(',')) moved=true; } return moved; }

function canMove() {
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(!board[r][c]) return true;
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE-1;c++) if(board[r][c]===board[r][c+1]) return true;
  for(let r=0;r<SIZE-1;r++) for(let c=0;c<SIZE;c++) if(board[r][c]===board[r+1][c]) return true;
  return false;
}

function checkWin() {
  for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]===2048) return true;
  return false;
}

function gameOver(won) {
  const o = document.getElementById('overlay');
  document.getElementById('msgTitle').textContent = won ? '你赢了！🎉' : '游戏结束';
  document.getElementById('msgText').textContent = won ? '恭喜你合成2048！继续挑战更高分吧！' : '没有可移动的方块了，再试一次吧！';
  o.classList.add('active');
}

function handleMove(direction) {
  let moved = false;
  if(direction==='left') moved=moveLeft();
  else if(direction==='right') moved=moveRight();
  else if(direction==='up') moved=moveUp();
  else if(direction==='down') moved=moveDown();
  if(moved){
    addRandom(); render(); updateScore();
    if(checkWin()) setTimeout(()=>gameOver(true), 300);
    else if(!canMove()) setTimeout(()=>gameOver(false), 300);
  }
}

document.addEventListener('keydown', e=>{
  if(document.getElementById('overlay').classList.contains('active')) return;
  switch(e.key){
    case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); handleMove('left'); break;
    case 'ArrowRight': case 'd': case 'D': e.preventDefault(); handleMove('right'); break;
    case 'ArrowUp': case 'w': case 'W': e.preventDefault(); handleMove('up'); break;
    case 'ArrowDown': case 's': case 'S': e.preventDefault(); handleMove('down'); break;
  }
});

const gc = document.getElementById('gameContainer');
gc.addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; }, {passive:true});
gc.addEventListener('touchend', e=>{
  if(document.getElementById('overlay').classList.contains('active')) return;
  const dx=e.changedTouches[0].clientX-touchStartX, dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)<30 && Math.abs(dy)<30) return;
  if(Math.abs(dx)>Math.abs(dy)) handleMove(dx>0?'right':'left');
  else handleMove(dy>0?'down':'up');
}, {passive:true});

initGrid(); newGame();
</script>
</body>
</html>
